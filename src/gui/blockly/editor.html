<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SoftEdIBO behaviour editor</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: sans-serif; }
    #blocklyDiv { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
    #error { padding: 16px; color: #b00; display: none; white-space: pre-wrap; }
    .se-picker { padding: 6px; width: 176px; }
    .se-picker-grid { display: grid; grid-template-columns: repeat(6, 24px); gap: 4px; }
    .se-swatch { width: 24px; height: 24px; border-radius: 4px; border: 1px solid #999;
                 cursor: pointer; box-sizing: border-box; }
    .se-swatch.selected { border: 3px solid #333; }
    .se-picker-custom { margin-top: 8px; display: flex; align-items: center; gap: 6px;
                        font-size: 12px; }
    .se-picker-custom input[type=color] { width: 40px; height: 24px; padding: 0;
                                          border: 1px solid #999; }
    .se-picker-custom input[type=text] { width: 70px; font-family: monospace; }
  </style>
</head>
<body>
  <div id="blocklyDiv"></div>
  <div id="error"></div>

  <script>
    // =====================================================================
    // SoftEdIBO behaviour editor.
    //
    // Python drives this page through a handful of globals:
    //   initEditor(payload)  - {catalog, palette}: the verb catalogue exported
    //                          by src/activities/catalog.py (editor_catalog())
    //                          plus the colour palette. Called once after the
    //                          page loads; every block, the toolbox and the
    //                          compile/decompile code are generated from it.
    //   getSpec()            - compile the workspace to a behaviour spec (JSON).
    //   getWarnings()        - editor-side warnings (duplicate phases, stray
    //                          blocks) as a JSON list of strings.
    //   loadSpec(json)       - show a spec (its saved workspace, or rebuilt
    //                          from the spec itself).
    //   newWorkspace()       - a fresh behaviour with one empty phase.
    //
    // Only three blocks are written by hand - the structural ones: the
    // behaviour root (target robot + skin), the phase, and the transition.
    // Everything else comes from the catalogue: each verb's `template` gives
    // the block's rows and words, each field's `type` picks the widget and
    // how it is read back into the spec.
    // =====================================================================

    // ---- Load Blockly: vendored first, CDN fallback --------------------
    function loadScript(src, onload, onerror) {
      var s = document.createElement('script');
      s.src = src; s.onload = onload; s.onerror = onerror;
      document.head.appendChild(s);
    }
    // The bundled build always ships blockly.min.js (softedibo.spec fails the
    // build without it), so reaching the CDN means an incomplete install - not
    // a normal offline run. Say that, rather than blaming the network.
    loadScript('./blockly.min.js', onBlocklyLoaded, function () {
      loadScript('https://unpkg.com/blockly/blockly.min.js', onBlocklyLoaded, function () {
        var e = document.getElementById('error');
        e.style.display = 'block';
        e.textContent = 'Could not load the block editor.\n\n'
          + 'This install is missing its Blockly copy '
          + '(src/gui/blockly/blockly.min.js), and the online fallback could '
          + 'not be reached either. Reinstall SoftEdIBO to fix it.';
      });
    });

    var workspace = null;
    var CATALOG = null;          // editor_catalog() payload
    var PALETTE = [];            // quick-pick colours for the swatch field
    var VERBS = {};              // verb name -> verb def
    var BLOCK_DEFS = {};         // block type -> {verb, count}
    var CATEGORY_HUE = {};       // category name -> hue
    var mediaPath = null;
    var blocklyReady = false;
    var pending = [];            // ops requested before the editor was ready

    var MS_UNITS = [['ms', '1'], ['s', '1000'], ['min', '60000']];
    var ANY_ROBOT = 'any', ANY_SKIN = 'any';

    // ---- Boot ----------------------------------------------------------
    function onBlocklyLoaded() {
      if (blocklyReady) return;           // both loaders fired - ignore the 2nd
      // Blockly needs a "media" folder (sprites for the trashcan/zoom/dropdown
      // icons + click/delete sounds). Use a vendored ./media/ when present
      // (offline), else the CDN. Probe a sprite to decide.
      var img = new Image();
      img.onload = function () { mediaPath = './media/'; blocklyReady = true; maybeStart(); };
      img.onerror = function () { mediaPath = 'https://unpkg.com/blockly/media/';
                                  blocklyReady = true; maybeStart(); };
      img.src = './media/sprites.svg';
    }

    function initEditor(payload) {
      var p = (typeof payload === 'string') ? JSON.parse(payload) : payload;
      CATALOG = p.catalog || p;
      PALETTE = p.palette || [];
      maybeStart();
    }

    function maybeStart() {
      if (workspace || !blocklyReady || !CATALOG) return;
      CATALOG.categories.forEach(function (c) { CATEGORY_HUE[c.name] = c.colour; });
      CATALOG.verbs.forEach(function (v) { VERBS[v.name] = v; });
      defineFields();
      defineStructuralBlocks();
      defineCatalogBlocks();
      workspace = Blockly.inject('blocklyDiv', {
        media: mediaPath,
        toolbox: buildToolbox(),
        trashcan: true,
        comments: true,
        zoom: { controls: true, wheel: true, startScale: 0.9 },
        grid: { spacing: 20, length: 3, colour: '#eee', snap: true },
      });
      var ops = pending; pending = [];
      if (!ops.length) newWorkspace();
      ops.forEach(function (fn) { fn(); });
    }

    function whenReady(fn) {
      if (workspace) fn(); else pending.push(fn);
    }

    // ---- Custom fields ------------------------------------------------
    var FieldSwatch, FieldPhase;

    function normaliseHex(v) {
      if (typeof v !== 'string') return null;
      var s = v.trim().toLowerCase();
      if (/^[0-9a-f]{6}$/.test(s)) s = '#' + s;
      if (/^#[0-9a-f]{3}$/.test(s)) s = '#' + s[1] + s[1] + s[2] + s[2] + s[3] + s[3];
      return /^#[0-9a-f]{6}$/.test(s) ? s : null;
    }

    function defineFields() {
      // A colour swatch: click to pick from the study palette or any colour.
      FieldSwatch = class extends Blockly.Field {
        constructor(value, validator) {
          super(Blockly.Field.SKIP_SETUP);
          this.SERIALIZABLE = true;
          this.CURSOR = 'pointer';
          this.setValue(normaliseHex(value) || '#000000');
          if (validator) this.setValidator(validator);
        }
        initView() {
          this.size_ = new Blockly.utils.Size(28, 18);
          this.createBorderRect_();
          var r = this.getBorderRect();
          r.style.fillOpacity = '1';
          r.setAttribute('stroke', '#fff');
          r.setAttribute('rx', '4'); r.setAttribute('ry', '4');
          this.paint_();
        }
        paint_() {
          var r = this.borderRect_;
          if (!r) return;
          r.style.fill = this.getValue();
          r.setAttribute('width', String(this.size_.width));
          r.setAttribute('height', String(this.size_.height));
        }
        render_() { this.paint_(); }
        applyColour() { this.paint_(); }
        doClassValidation_(v) { return normaliseHex(v); }
        doValueUpdate_(v) { super.doValueUpdate_(v); this.paint_(); }
        getText_() { return this.getValue(); }
        showEditor_() {
          var self = this;
          var div = document.createElement('div');
          div.className = 'se-picker';
          var grid = document.createElement('div');
          grid.className = 'se-picker-grid';
          PALETTE.forEach(function (hex) {
            var sw = document.createElement('div');
            sw.className = 'se-swatch' + (hex === self.getValue() ? ' selected' : '');
            sw.style.background = hex;
            sw.title = hex;
            sw.addEventListener('mousedown', function (e) {
              e.preventDefault();
              self.setValue(hex);
              Blockly.DropDownDiv.hideIfOwner(self);
            });
            grid.appendChild(sw);
          });
          div.appendChild(grid);
          var custom = document.createElement('div');
          custom.className = 'se-picker-custom';
          var input = document.createElement('input');
          input.type = 'color'; input.value = self.getValue();
          var text = document.createElement('input');
          text.type = 'text'; text.value = self.getValue(); text.maxLength = 7;
          input.addEventListener('input', function () {
            self.setValue(input.value); text.value = input.value;
          });
          text.addEventListener('change', function () {
            var hex = normaliseHex(text.value);
            if (hex) { self.setValue(hex); input.value = hex; }
            else text.value = self.getValue();
          });
          custom.appendChild(document.createTextNode('custom'));
          custom.appendChild(input);
          custom.appendChild(text);
          div.appendChild(custom);
          Blockly.DropDownDiv.clearContent();
          Blockly.DropDownDiv.getContentDiv().appendChild(div);
          Blockly.DropDownDiv.showPositionedByField(this, null);
        }
        static fromJson(o) { return new FieldSwatch(o.colour); }
      };

      // A dropdown of the phases currently in the workspace. Any string is a
      // valid value (a saved spec may name a phase whose block is built a
      // moment later, or was deleted); the options always include the current
      // value so it keeps showing.
      FieldPhase = class extends Blockly.FieldDropdown {
        constructor(optional) {
          super(function () { return this.phaseOptions_(); });
          this.optional_ = !!optional;
        }
        phaseOptions_() {
          var opts = [];
          if (this.optional_) opts.push(['(no jump)', '']);
          var seen = {};
          var block = this.getSourceBlock && this.getSourceBlock();
          var ws = block && block.workspace;
          if (ws && !ws.isFlyout) {
            ws.getBlocksByType('se_state', true).forEach(function (b) {
              var n = b.getFieldValue('NAME');
              if (n && !seen[n]) { seen[n] = 1; opts.push([n, n]); }
            });
          }
          var cur = this.getValue();
          if (typeof cur === 'string' && cur !== '' && !seen[cur]) {
            opts.push([cur + (ws && !ws.isFlyout ? ' (missing)' : ''), cur]);
          }
          if (!opts.length) opts.push(['phase1', 'phase1']);
          return opts;
        }
        doClassValidation_(v) { return (typeof v === 'string') ? v : null; }
        getText_() {
          var v = this.getValue();
          var hit = null;
          this.getOptions(false).forEach(function (o) { if (o[1] === v) hit = o[0]; });
          return hit !== null ? hit : (v || '');
        }
      };
    }

    function setPhaseField(block, name, value) {
      var f = block.getField(name);
      if (!f) return;
      f.getOptions(false);                 // drop the cached option list
      f.setValue(value == null ? '' : String(value));
    }

    // ---- Structural blocks: behaviour root, phase, transition ----------
    function defineStructuralBlocks() {
      var hue = CATEGORY_HUE['Phases'];
      var robots = [['any robot', ANY_ROBOT]].concat(
        CATALOG.robots.map(function (r) { return [r.label, r.value]; }));
      var skins = [['any skin', ANY_SKIN]].concat(
        CATALOG.skins.map(function (s) { return [s.label, s.value]; }));

      Blockly.Blocks['se_behaviour'] = {
        init: function () {
          this.appendDummyInput()
            .appendField('behaviour for robot')
            .appendField(new Blockly.FieldDropdown(robots), 'ROBOT')
            .appendField('skin')
            .appendField(new Blockly.FieldDropdown(skins), 'SKIN');
          this.appendStatementInput('STATES')
            .setCheck('State')
            .appendField('- starts at the first phase');
          this.setColour(hue);
          this.setDeletable(false);
          this.setTooltip(
            'Root of a behaviour. Stack phases inside; the first one is where '
            + 'it starts. "for robot" narrows the activity to one robot kind '
            + '(Thymio / Turtle / Tree) or leaves it open; "skin" declares '
            + 'which silicone set it is written for (Natural / Wrinkles / '
            + 'Organs) so the session pre-selects the matching activity and '
            + 'warns when a robot wears different skins.');
        },
      };

      Blockly.Blocks['se_state'] = {
        init: function () {
          var self = this;
          this.appendDummyInput()
            .appendField('phase')
            .appendField(new Blockly.FieldTextInput('phase1', function (name) {
              name = (name || '').trim();
              if (!name) return null;
              renamePhaseRefs(self, this.getValue(), name);
              return name;
            }), 'NAME')
            .appendField(new Blockly.FieldCheckbox('FALSE'), 'FINAL')
            .appendField('final');
          this.appendStatementInput('DO').setCheck('Step').appendField('do');
          this.appendStatementInput('ONTOUCH').setCheck('Step').appendField('on touch');
          this.appendStatementInput('TRANSITIONS').setCheck('Transition')
            .appendField('transitions');
          this.setPreviousStatement(true, 'State');
          this.setNextStatement(true, 'State');
          this.setColour(hue);
          this.setTooltip(
            'One phase: "do" runs once when the phase starts (wrap a beat in '
            + '"repeat forever" to keep it going), "on touch" runs on every '
            + 'press, and the transitions say when to move to another phase. '
            + 'Tick "final" on the phase where the story ends (the cured '
            + 'robot) - the live CPR window and the session controls use it.');
        },
      };

      Blockly.Blocks['se_transition'] = {
        init: function () {
          this.appendValueInput('WHEN')
            .setCheck('Cond')
            .appendField('go to phase')
            .appendField(new FieldPhase(false), 'TO')
            .appendField('when');
          this.setPreviousStatement(true, 'Transition');
          this.setNextStatement(true, 'Transition');
          this.setColour(CATEGORY_HUE['Conditions']);
          this.setTooltip('Move to another phase when the condition becomes '
            + 'true. Transitions are checked in order, every tick.');
        },
      };
    }

    // ---- Catalogue-generated blocks -----------------------------------
    function encodeChoice(v) { return (typeof v === 'string') ? v : JSON.stringify(v); }

    function decodeChoice(field, s) {
      var hit;
      (field.choices || []).forEach(function (c) {
        if (hit === undefined && encodeChoice(c.value) === String(s)) hit = c.value;
      });
      return hit === undefined ? s : hit;
    }

    function dropdownOptions(field) {
      return (field.choices || []).map(function (c) {
        return [String(c.label), encodeChoice(c.value)];
      });
    }

    function fieldMin(f, fallback) { return (f.min != null) ? f.min : fallback; }
    function fieldMax(f, fallback) { return (f.max != null) ? f.max : fallback; }

    // Split a template row into literal words and {field} placeholders.
    function tokens(row) {
      var out = [], re = /\{(\w+)\}/g, last = 0, m;
      while ((m = re.exec(row)) !== null) {
        if (m.index > last) out.push({ text: row.slice(last, m.index) });
        out.push({ field: m[1] });
        last = re.lastIndex;
      }
      if (last < row.length) out.push({ text: row.slice(last) });
      return out;
    }

    function splitMs(ms) {
      ms = Number(ms) || 0;
      if (ms !== 0 && ms % 60000 === 0) return [ms / 60000, '60000'];
      if (ms !== 0 && ms % 1000 === 0) return [ms / 1000, '1000'];
      return [ms, '1'];
    }

    function blockTypeFor(verb, variantId) {
      return 'se_' + verb + (variantId ? '__' + variantId : '');
    }

    function slotCount(field, def) {
      return def.count || field.count || (Array.isArray(field.default) ? field.default.length : 1);
    }

    // Append the widget(s) for one field to a Blockly input.
    function appendFieldWidgets(block, input, f, def) {
      var i, n;
      switch (f.type) {
        case 'int':
          input.appendField(new Blockly.FieldNumber(
            f.default != null ? f.default : 0, fieldMin(f, -Infinity),
            fieldMax(f, Infinity), 1), f.name);
          break;
        case 'float':
          input.appendField(new Blockly.FieldNumber(
            f.default != null ? f.default : 0, fieldMin(f, -Infinity),
            fieldMax(f, Infinity), 0.01), f.name);
          break;
        case 'pct':
          input.appendField(new Blockly.FieldNumber(
            f.default != null ? f.default : 0, fieldMin(f, 0), fieldMax(f, 100), 1),
            f.name);
          break;
        case 'ms': {
          var parts = splitMs(f.default);
          input.appendField(new Blockly.FieldNumber(
            parts[0], fieldMin(f, 0) / 60000, fieldMax(f, Infinity), 0.001), f.name);
          input.appendField(new Blockly.FieldDropdown(MS_UNITS), f.name + '__unit');
          block.setFieldValue(parts[1], f.name + '__unit');
          break;
        }
        case 'color':
          input.appendField(new FieldSwatch(f.default || '#000000'), f.name);
          break;
        case 'colors':
          n = slotCount(f, def);
          for (i = 0; i < n; i++) {
            var c = (f.default || [])[i] || '#888888';
            input.appendField(new FieldSwatch(c), f.name + '__' + i);
          }
          break;
        case 'ints':
          n = slotCount(f, def);
          for (i = 0; i < n; i++) {
            var d = (f.default || [])[i];
            input.appendField(new Blockly.FieldNumber(
              d != null ? d : i, fieldMin(f, -Infinity), fieldMax(f, Infinity), 1),
              f.name + '__' + i);
          }
          break;
        case 'enum': case 'chamber': case 'ring': case 'power':
          input.appendField(new Blockly.FieldDropdown(dropdownOptions(f)), f.name);
          if (f.default != null) block.setFieldValue(encodeChoice(f.default), f.name);
          break;
        case 'phase':
          input.appendField(new FieldPhase(true), f.name);
          break;
        case 'text':
          input.appendField(new Blockly.FieldTextInput(f.default || ''), f.name);
          break;
        default:
          throw new Error('unknown field type ' + f.type + ' on ' + f.name);
      }
    }

    function defineCatalogBlocks() {
      CATALOG.verbs.forEach(function (verb) {
        defineVerbBlock(verb, null);
        (verb.variants || []).forEach(function (v) { defineVerbBlock(verb, v); });
      });
    }

    function defineVerbBlock(verb, variant) {
      var type = blockTypeFor(verb.name, variant && variant.id);
      var def = { verb: verb, variant: variant, count: variant ? variant.count : 0 };
      BLOCK_DEFS[type] = def;
      var fieldsByName = {};
      verb.fields.forEach(function (f) { fieldsByName[f.name] = f; });
      var template = variant ? variant.template : verb.template;
      var hue = CATEGORY_HUE[verb.category] != null ? CATEGORY_HUE[verb.category] : 0;
      var tooltip = verb.description;
      var extras = verb.fields.filter(function (f) { return !f.hidden && f.description; })
        .map(function (f) { return f.name.replace(/_/g, ' ') + ': ' + f.description; });
      if (extras.length) tooltip += '\n\n' + extras.join('\n');

      Blockly.Blocks[type] = {
        init: function () {
          var self = this;
          this.rows_ = [];            // [{input, fields:[fieldDef], conditional}]
          this.condCount_ = 0;
          template.split('\n').forEach(function (row, rowIdx) {
            var toks = tokens(row);
            var stmt = null, cond = null, conds = null;
            toks.forEach(function (t) {
              if (!t.field) return;
              var f = fieldsByName[t.field];
              if (!f) throw new Error(verb.name + ': template names unknown field ' + t.field);
              if (f.type === 'steps') stmt = f;
              else if (f.type === 'cond') cond = f;
              else if (f.type === 'conds') conds = f;
            });
            var input;
            if (stmt) input = self.appendStatementInput(stmt.name).setCheck('Step');
            else if (cond) input = self.appendValueInput(cond.name).setCheck('Cond');
            else input = self.appendDummyInput('row' + rowIdx);
            var rowFields = [];
            toks.forEach(function (t) {
              if (t.text !== undefined) {
                var txt = t.text.trim();
                if (txt) input.appendField(txt);
                return;
              }
              var f = fieldsByName[t.field];
              if (f.type === 'steps' || f.type === 'cond') return;   // the input itself
              if (f.type === 'conds') {
                input.appendField(new Blockly.FieldDropdown(
                  [['2', '2'], ['3', '3'], ['4', '4']],
                  function (v) { self.reshapeConds_(Number(v)); return v; }),
                  f.name + '__count');
                self.condsField_ = f;
                return;
              }
              appendFieldWidgets(self, input, f, def);
              rowFields.push(f);
            });
            var conditional = rowFields.length > 0 &&
              rowFields.every(function (f) { return !!f.show_when; });
            self.rows_.push({ input: input, fields: rowFields, conditional: conditional });
          });
          if (this.condsField_) this.reshapeConds_(2);
          // Fields that control another field's visibility re-shape on change.
          var controllers = {};
          verb.fields.forEach(function (f) { if (f.show_when) controllers[f.show_when.field] = 1; });
          Object.keys(controllers).forEach(function (name) {
            var fld = self.getField(name);
            if (!fld) return;
            fld.setValidator(function (v) {
              var o = {}; o[name] = v;
              self.updateShape_(o);
              return v;
            });
          });
          if (verb.kind === 'condition') this.setOutput(true, 'Cond');
          else { this.setPreviousStatement(true, 'Step'); this.setNextStatement(true, 'Step'); }
          this.setColour(hue);
          this.setTooltip(tooltip);
          this.updateShape_({});
        },
        // Show/hide the conditional fields (and rows that are nothing but
        // conditional fields) from the controlling fields' current values.
        updateShape_: function (overrides) {
          var self = this;
          overrides = overrides || {};
          this.rows_.forEach(function (row) {
            var anyVisible = false;
            row.fields.forEach(function (f) {
              var vis = fieldVisible(self, f, overrides);
              fieldWidgetNames(self, f, def).forEach(function (n) {
                var w = self.getField(n);
                if (w) w.setVisible(vis);
              });
              if (vis) anyVisible = true;
            });
            if (row.conditional) row.input.setVisible(anyVisible);
          });
          if (this.rendered) this.render();
        },
        // Add/remove the condition slots to match n (2-4). Called by the
        // count dropdown's validator; programmatic callers go through
        // setCondCount_, which sets the dropdown and lands here.
        reshapeConds_: function (n) {
          n = Math.max(2, Math.min(4, n || 2));
          var name = this.condsField_ ? this.condsField_.name : 'conds';
          for (var i = 0; i < 4; i++) {
            var inp = this.getInput(name + '__' + i);
            if (i < n && !inp) this.appendValueInput(name + '__' + i).setCheck('Cond');
            else if (i >= n && inp) this.removeInput(name + '__' + i);
          }
          this.condCount_ = n;
        },
        setCondCount_: function (n) {
          n = Math.max(2, Math.min(4, n || 2));
          var name = this.condsField_ ? this.condsField_.name : 'conds';
          this.setFieldValue(String(n), name + '__count');
          this.reshapeConds_(n);
        },
        saveExtraState: function () {
          return this.condsField_ ? { n: this.condCount_ } : null;
        },
        loadExtraState: function (state) {
          if (this.condsField_ && state && state.n) this.setCondCount_(state.n);
        },
      };
    }

    // The Blockly field names a catalogue field occupies on a block.
    function fieldWidgetNames(block, f, def) {
      var out = [], n, i;
      if (f.type === 'ms') return [f.name, f.name + '__unit'];
      if (f.type === 'colors' || f.type === 'ints') {
        n = slotCount(f, def);
        for (i = 0; i < n; i++) out.push(f.name + '__' + i);
        return out;
      }
      return [f.name];
    }

    function fieldVisible(block, f, overrides) {
      if (!f.show_when) return true;
      var ctrl = f.show_when.field;
      var raw = (overrides && overrides[ctrl] !== undefined)
        ? overrides[ctrl] : block.getFieldValue(ctrl);
      var ctrlDef = BLOCK_DEFS[block.type].verb.fields.filter(function (x) { return x.name === ctrl; })[0];
      var val = ctrlDef ? decodeChoice(ctrlDef, raw) : raw;
      return f.show_when.values.some(function (v) { return v === val; });
    }

    // ---- Toolbox --------------------------------------------------------
    function buildToolbox() {
      var byCat = {};
      CATALOG.verbs.forEach(function (v) {
        if (!v.in_toolbox) return;
        (byCat[v.category] = byCat[v.category] || []).push({ kind: 'block', type: blockTypeFor(v.name) });
        (v.variants || []).forEach(function (x) {
          byCat[v.category].push({ kind: 'block', type: blockTypeFor(v.name, x.id) });
        });
      });
      var contents = CATALOG.categories.map(function (c) {
        var blocks = c.name === 'Phases'
          ? [{ kind: 'block', type: 'se_state' }, { kind: 'block', type: 'se_transition' }]
          : (byCat[c.name] || []);
        return { kind: 'category', name: c.name, colour: String(c.colour), contents: blocks };
      });
      return { kind: 'categoryToolbox', contents: contents };
    }

    // ---- Keep phase references in step with renames --------------------
    // Renaming a phase (typing in its name box) rewrites every "go to phase"
    // and fill-jump that pointed at the old name. Off while a spec is being
    // loaded: then the name boxes are being set from the spec and the
    // references already carry their final names.
    var loadingSpec = false;

    function renamePhaseRefs(stateBlock, oldName, newName) {
      if (loadingSpec || !workspace || !oldName || oldName === newName) return;
      if (stateBlock.workspace !== workspace || stateBlock.isInFlyout) return;
      workspace.getAllBlocks(false).forEach(function (blk) {
        blk.inputList.forEach(function (input) {
          input.fieldRow.forEach(function (f) {
            if (f instanceof FieldPhase && f.getValue() === oldName) {
              f.getOptions(false);
              f.setValue(newName);
            }
          });
        });
      });
    }

    // ---- Compile workspace -> spec --------------------------------------
    function readField(block, f, def) {
      var i, n, out;
      switch (f.type) {
        case 'int': return Math.round(Number(block.getFieldValue(f.name)));
        case 'float': case 'pct': return Number(block.getFieldValue(f.name));
        case 'ms':
          return Math.round(Number(block.getFieldValue(f.name))
                            * Number(block.getFieldValue(f.name + '__unit')));
        case 'color': case 'text': return block.getFieldValue(f.name);
        case 'phase': return block.getFieldValue(f.name) || '';
        case 'colors': case 'ints':
          n = slotCount(f, def); out = [];
          for (i = 0; i < n; i++) {
            var v = block.getFieldValue(f.name + '__' + i);
            out.push(f.type === 'ints' ? Math.round(Number(v)) : v);
          }
          return out;
        case 'enum': case 'chamber': case 'ring': case 'power':
          return decodeChoice(f, block.getFieldValue(f.name));
        case 'steps': return stepsFromStack(block.getInputTargetBlock(f.name));
        case 'cond': return condToObj(block.getInputTargetBlock(f.name));
        case 'conds':
          out = [];
          for (i = 0; i < block.condCount_; i++) {
            var child = block.getInputTargetBlock(f.name + '__' + i);
            if (child) out.push(condToObj(child));
          }
          return out;
        default: return undefined;
      }
    }

    function sameValue(a, b) { return JSON.stringify(a) === JSON.stringify(b); }

    // Verb-specific touch-ups after the generic read.
    var FINALIZE = {
      group_touch_sync: function (o) {
        if (Array.isArray(o.sensors)) o.sensors = o.sensors.slice(0, Math.max(1, o.participants || 1));
      },
    };

    function blockToObj(b) {
      var def = BLOCK_DEFS[b.type];
      if (!def) return null;
      var params = {};
      def.verb.fields.forEach(function (f) {
        if (f.hidden) return;
        if (!fieldVisible(b, f, null)) return;
        var v = readField(b, f, def);
        if (v === undefined) return;
        if (f.omit_default && sameValue(v, f.default)) return;
        params[f.name] = v;
      });
      if (FINALIZE[def.verb.name]) FINALIZE[def.verb.name](params, b);
      var out = {};
      // A verb whose only field is a condition slot (any / all / not) is
      // written bare in the spec: {"any": [...]}, {"not": {...}}.
      var only = def.verb.fields.length === 1 ? def.verb.fields[0] : null;
      if (only && (only.type === 'conds' || only.type === 'cond')) {
        out[def.verb.name] = params[only.name];
      } else {
        out[def.verb.name] = params;
      }
      return out;
    }

    function stepsFromStack(block) {
      var out = [];
      while (block) {
        var o = blockToObj(block);
        if (o) out.push(o);
        block = block.getNextBlock();
      }
      return out;
    }

    function condToObj(b) {
      if (!b) return { always: true };
      var o = blockToObj(b);
      return o || { always: true };
    }

    function transitionsFromStack(block) {
      var out = [];
      while (block) {
        out.push({ to: block.getFieldValue('TO') || '',
                   when: condToObj(block.getInputTargetBlock('WHEN')) });
        block = block.getNextBlock();
      }
      return out;
    }

    function compileSpec() {
      var roots = workspace.getBlocksByType('se_behaviour', true);
      var states = {}, initial = null, robot = ANY_ROBOT, skin = ANY_SKIN;
      if (roots.length) {
        robot = roots[0].getFieldValue('ROBOT') || ANY_ROBOT;
        skin = roots[0].getFieldValue('SKIN') || ANY_SKIN;
        var s = roots[0].getInputTargetBlock('STATES');
        while (s) {
          var name = s.getFieldValue('NAME');
          if (initial === null) initial = name;
          var st = {
            do: stepsFromStack(s.getInputTargetBlock('DO')),
            on_touch: stepsFromStack(s.getInputTargetBlock('ONTOUCH')),
            transitions: transitionsFromStack(s.getInputTargetBlock('TRANSITIONS')),
          };
          if (s.getFieldValue('FINAL') === 'TRUE') st.final = true;
          states[name] = st;
          s = s.getNextBlock();
        }
      }
      var spec = { initial: initial, states: states };
      var target = {};
      if (robot !== ANY_ROBOT) target.kind = robot;
      if (skin !== ANY_SKIN) target.skin = skin;
      if (Object.keys(target).length) spec.target = target;
      return spec;
    }

    function getSpec() {
      var spec = compileSpec();
      // _blockly carries the exact workspace so the editor can round-trip
      // block positions and collapsed state; the runtime/validator ignore it.
      spec._blockly = { format: 2,
                        workspace: Blockly.serialization.workspaces.save(workspace) };
      return JSON.stringify(spec);
    }

    function getWarnings() {
      var out = [];
      if (!workspace) return JSON.stringify(out);
      var roots = workspace.getBlocksByType('se_behaviour', true);
      var seen = {}, dupes = {};
      if (roots.length) {
        var s = roots[0].getInputTargetBlock('STATES');
        while (s) {
          var n = s.getFieldValue('NAME');
          if (seen[n]) dupes[n] = 1; else seen[n] = 1;
          s = s.getNextBlock();
        }
      }
      Object.keys(dupes).forEach(function (n) {
        out.push("Two phases are called '" + n + "' - only the last one is kept. Rename one.");
      });
      var stray = workspace.getTopBlocks(false).filter(function (b) { return b.type !== 'se_behaviour'; });
      if (stray.length) {
        out.push(stray.length + ' block(s) are lying loose outside the behaviour and will be ignored.');
      }
      return JSON.stringify(out);
    }

    // ---- Load / reset -------------------------------------------------
    function stripEditorKeys(spec) {
      var copy = JSON.parse(JSON.stringify(spec));
      delete copy._blockly;
      return copy;
    }

    function loadSpec(json) {
      whenReady(function () { loadSpecNow(json); });
    }

    function loadSpecNow(json) {
      loadingSpec = true;
      try { loadSpecGuarded(json); }
      finally { loadingSpec = false; }
    }

    function loadSpecGuarded(json) {
      var spec = null;
      try { spec = (typeof json === 'string') ? JSON.parse(json) : json; }
      catch (e) { console.warn('loadSpec: bad JSON, starting fresh:', e); }
      if (!spec || !spec.states) { newWorkspace(); return; }
      var blob = spec._blockly;
      if (blob && blob.format === 2 && blob.workspace) {
        try {
          Blockly.serialization.workspaces.load(blob.workspace, workspace);
          renderAllBlocks();
          // The saved workspace must compile back to the saved spec; if the
          // catalogue moved on since it was saved, rebuild from the spec
          // (the authoritative copy) rather than show stale blocks.
          if (sameValue(normaliseSpec(compileSpec()), normaliseSpec(stripEditorKeys(spec)))) return;
          console.warn('saved workspace no longer matches its spec - rebuilding from the spec');
        } catch (e) {
          console.warn('saved workspace failed to load - rebuilding from the spec:', e);
        }
      }
      buildBlocksFromSpec(spec);
    }

    // Canonical form for comparing a compiled spec with a stored one: the
    // editor always emits every visible field, so only key sets that both
    // carry are compared, and scalar shorthands are expanded.
    function normaliseSpec(spec) {
      return { initial: spec.initial, target: spec.target || null,
               states: spec.states };
    }

    // ---- Rebuild blocks from a bare spec (inverse of compileSpec) ------
    function newBlock(type) {
      var b = workspace.newBlock(type);
      b.initSvg();
      return b;
    }

    function setF(b, name, val) {
      if (val === undefined || val === null) return;
      try { b.setFieldValue(String(val), name); }
      catch (e) { console.warn('setFieldValue', name, val, e); }
    }

    // The 1-5 power dial from a spec: an explicit 'power', or a legacy raw
    // 'duty' converted to the nearest level (floor ~190 -> 1, 255 -> 5).
    function powerFrom(p) {
      if (p.power != null) return Number(p.power);
      if (p.duty) {
        var MIN = 190, span = 255 - MIN;
        var duty = Math.max(MIN, Math.min(255, p.duty));
        return Math.max(1, Math.min(5, 1 + Math.round((duty - MIN) / span * 4)));
      }
      return null;
    }

    function connectStack(parent, inputName, firstChild) {
      if (firstChild && parent.getInput(inputName)) {
        parent.getInput(inputName).connection.connect(firstChild.previousConnection);
      }
    }

    function connectCond(parent, inputName, child) {
      if (child && child.outputConnection && parent.getInput(inputName)) {
        parent.getInput(inputName).connection.connect(child.outputConnection);
      }
    }

    function buildStack(steps) {
      var first = null, prev = null;
      (steps || []).forEach(function (step) {
        var b = buildStep(step);
        if (!b) return;
        if (prev) prev.nextConnection.connect(b.previousConnection);
        else first = b;
        prev = b;
      });
      return first;
    }

    // Pick the block (base or variant) whose slot count fits the spec's list.
    function pickBlockType(verb, p) {
      var listField = verb.fields.filter(function (f) { return f.type === 'colors' || f.type === 'ints'; })[0];
      if (listField && Array.isArray(p[listField.name])) {
        var n = p[listField.name].length, best = null;
        (verb.variants || []).forEach(function (v) {
          if (v.count <= n && (!best || v.count > best.count)) best = v;
        });
        var baseCount = listField.count || (listField.default || []).length;
        if (best && best.count > baseCount) return blockTypeFor(verb.name, best.id);
      }
      return blockTypeFor(verb.name);
    }

    function writeField(b, f, def, v) {
      var i, n;
      if (v === undefined || v === null) return;
      switch (f.type) {
        case 'ms': {
          var parts = splitMs(v);
          setF(b, f.name, parts[0]); setF(b, f.name + '__unit', parts[1]);
          break;
        }
        case 'colors': case 'ints':
          n = slotCount(f, def);
          for (i = 0; i < n && i < v.length; i++) setF(b, f.name + '__' + i, v[i]);
          break;
        case 'enum': case 'chamber': case 'ring': case 'power':
          setF(b, f.name, encodeChoice(decodeChoice(f, v)));
          break;
        case 'phase': setPhaseField(b, f.name, v); break;
        case 'steps': connectStack(b, f.name, buildStack(v)); break;
        case 'cond': connectCond(b, f.name, buildCond(v)); break;
        case 'conds':
          b.setCondCount_(Math.max(2, (v || []).length));
          (v || []).forEach(function (c, idx) {
            if (idx < 4) connectCond(b, f.name + '__' + idx, buildCond(c));
          });
          break;
        default: setF(b, f.name, v);
      }
    }

    function buildVerbBlock(verbName, p) {
      var verb = VERBS[verbName];
      if (!verb) return null;
      var raw = p;
      if (!p || typeof p !== 'object' || Array.isArray(p)) p = { _value: p };
      var b = newBlock(pickBlockType(verb, p));
      var def = BLOCK_DEFS[b.type];
      // Scalar shorthand ({"wait": 500}) fills the first plain field.
      if (p._value !== undefined) {
        var first = verb.fields.filter(function (f) {
          return !f.hidden && ['steps', 'cond', 'conds'].indexOf(f.type) < 0;
        })[0];
        if (first) { p = {}; p[first.name] = raw; }
      }
      verb.fields.forEach(function (f) {
        if (f.hidden) return;
        var v = p[f.name];
        if (f.type === 'power') v = powerFrom(p);
        if (f.name === 'forever' && verb.name === 'repeat') {
          v = !!p.forever || p.times == null || p.times === 'forever';
        }
        if (f.name === 'mode' && verb.name === 'group_touch_sync') {
          v = Array.isArray(p.sensors) ? 'fixed' : (p.mode === 'fixed' ? 'fixed' : 'auto');
        }
        writeField(b, f, def, v);
      });
      if (b.updateShape_) b.updateShape_({});
      return b;
    }

    function buildStep(step) {
      if (!step || typeof step !== 'object') return null;
      var verb = Object.keys(step)[0];
      var p = step[verb];
      if (verb === 'wrinkle') {          // deprecated alias of set_pressure 0 %
        verb = 'set_pressure';
        p = Object.assign({}, (p && typeof p === 'object') ? p : {}, { pct: 0 });
      }
      return buildVerbBlock(verb, p);
    }

    function buildCond(cond) {
      if (!cond || typeof cond !== 'object') return newBlock('se_always');
      var name = Object.keys(cond)[0];
      if (name === 'or') name = 'any';
      if (name === 'and') name = 'all';
      var v = cond[name];
      if (name === 'any' || name === 'all') v = { conds: v };
      if (name === 'not') v = { cond: v };
      return buildVerbBlock(name, v) || newBlock('se_always');
    }

    function buildTransitions(transitions) {
      var first = null, prev = null;
      (transitions || []).forEach(function (tr) {
        var b = newBlock('se_transition');
        setPhaseField(b, 'TO', tr.to);
        connectCond(b, 'WHEN', buildCond(tr.when));
        if (prev) prev.nextConnection.connect(b.previousConnection);
        else first = b;
        prev = b;
      });
      return first;
    }

    function buildBlocksFromSpec(spec) {
      workspace.clear();
      var root = newBlock('se_behaviour');
      var target = spec.target || {};
      setF(root, 'ROBOT', target.kind || ANY_ROBOT);
      setF(root, 'SKIN', target.skin || ANY_SKIN);
      root.moveBy(30, 30);
      var states = spec.states || {};
      var order = Object.keys(states);
      // Keep the declared initial phase first, so the editor's "starts at the
      // first phase" matches the spec's initial state.
      if (spec.initial && order.indexOf(spec.initial) > 0) {
        order = [spec.initial].concat(order.filter(function (n) { return n !== spec.initial; }));
      }
      // Create every phase block first so phase dropdowns can list them all,
      // then fill the bodies.
      var blocks = {}, prevState = null;
      order.forEach(function (name) {
        var sb = newBlock('se_state');
        setF(sb, 'NAME', name);
        if (states[name] && states[name].final) setF(sb, 'FINAL', 'TRUE');
        blocks[name] = sb;
        if (prevState) prevState.nextConnection.connect(sb.previousConnection);
        else connectStack(root, 'STATES', sb);
        prevState = sb;
      });
      order.forEach(function (name) {
        var st = states[name] || {}, sb = blocks[name];
        connectStack(sb, 'DO', buildStack(st.do));
        connectStack(sb, 'ONTOUCH', buildStack(st.on_touch));
        connectStack(sb, 'TRANSITIONS', buildTransitions(st.transitions));
      });
      root.render();
      renderAllBlocks();
    }

    // After a programmatic deserialize, Blockly 13 can leave nested blocks
    // unmeasured (width/height 0) so only the last phase's body renders and the
    // earlier phases look empty. Queue a render on EVERY block (not just the
    // top-level one) and flush, so the whole tree lays out.
    function renderAllBlocks() {
      try {
        workspace.getAllBlocks(false).forEach(function (b) {
          if (b.queueRender) b.queueRender();
        });
        var rm = Blockly.renderManagement;
        if (rm && rm.triggerQueuedRenders) rm.triggerQueuedRenders();
      } catch (e) {
        console.warn('renderAllBlocks failed:', e);
      }
    }

    function newWorkspace() {
      whenReady(function () {
        loadingSpec = true;
        try { resetWorkspace(); }
        finally { loadingSpec = false; }
      });
    }

    function resetWorkspace() {
      {
        workspace.clear();
        var root = newBlock('se_behaviour');
        var st = newBlock('se_state');
        root.getInput('STATES').connection.connect(st.previousConnection);
        root.moveBy(30, 30);
        root.render();
        renderAllBlocks();
      }
    }
  </script>
</body>
</html>
