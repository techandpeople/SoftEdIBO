<!DOCTYPE html>
<!--
  Block editor for the SoftEdIBO behaviour engine (Tools => Activity Editor...).

  Scratch-like authoring: drag blocks to build a behaviour, which compiles to
  the declarative spec interpreted by ScriptedActivity (src/activities/
  scripted_activity.py). The editor (Blockly) is only ever loaded inside this
  dialog - never during a session.

  Python talks to this page through three global functions, called via
  QWebEngineView.page().runJavaScript:
    getSpec()        -> JSON string of {initial, states, _blockly}
    loadSpec(json)   -> restore a saved behaviour into the workspace
    newWorkspace()   -> reset to one empty phase

  Colours are plain "#rrggbb" tags in the colour blocks. The hosting panel
  shows a "Colour helper" side panel to pick a colour visually, copy its tag
  and preview it live on the connected robots - see behavior_editor_panel.py.

  Blockly is loaded from a vendored copy (./blockly.min.js) when present, else
  from the unpkg CDN. Run scripts/fetch_blockly.sh to vendor it for offline use.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Activity Editor - Visual</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: sans-serif; }
    #blocklyDiv { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
    #error { padding: 16px; color: #b00; display: none; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="blocklyDiv"></div>
  <div id="error"></div>
  <xml id="toolbox" style="display:none">
    <category name="Phases" colour="290">
      <block type="se_behaviour"></block>
      <block type="se_state"></block>
      <block type="se_transition"></block>
    </category>
    <category name="Lights" colour="230">
      <block type="se_set_led"></block>
      <block type="se_set_led_halves"></block>
      <block type="se_set_led_quarters"></block>
      <block type="se_fade"></block>
      <block type="se_touch_progress"></block>
    </category>
    <category name="Chambers" colour="30">
      <block type="se_inflate"></block>
      <block type="se_deflate"></block>
      <block type="se_set_pressure"></block>
      <block type="se_beat"></block>
      <block type="se_stop"></block>
    </category>
    <category name="Thymio" colour="160">
      <block type="se_thymio_drive"></block>
      <block type="se_thymio_leds"></block>
      <block type="se_thymio_sound"></block>
    </category>
    <category name="Control" colour="120">
      <block type="se_wait"></block>
      <block type="se_wait_for_touch"></block>
      <block type="se_repeat"></block>
      <block type="se_for_each"></block>
      <block type="se_if_robot"></block>
    </category>
    <category name="Conditions" colour="20">
      <block type="se_elapsed"></block>
      <block type="se_touch_count"></block>
      <block type="se_gesture_count"></block>
      <block type="se_on_impact"></block>
      <block type="se_on_lifted"></block>
      <block type="se_organs"></block>
      <block type="se_robot_is"></block>
      <block type="se_any"></block>
      <block type="se_all"></block>
      <block type="se_not"></block>
      <block type="se_always"></block>
    </category>
  </xml>

  <script>
    // ---- Load Blockly: vendored first, CDN fallback --------------------
    function loadScript(src, onload, onerror) {
      var s = document.createElement('script');
      s.src = src; s.onload = onload; s.onerror = onerror;
      document.head.appendChild(s);
    }
    // The bundled build always ships blockly.min.js (softedibo.spec fails the
    // build without it), so reaching the CDN means an incomplete install - not
    // a normal offline run. Say that, rather than blaming the network: the CDN
    // hop silently masked a missing asset for every machine that had internet.
    loadScript('./blockly.min.js', init, function () {
      loadScript('https://unpkg.com/blockly/blockly.min.js', init, function () {
        var e = document.getElementById('error');
        e.style.display = 'block';
        e.textContent = 'Could not load the block editor.\n\n'
          + 'This install is missing its Blockly copy '
          + '(src/gui/blockly/blockly.min.js), and the online fallback could '
          + 'not be reached either. Reinstall SoftEdIBO to fix it.';
      });
    });

    var workspace = null;
    var DEFAULT_COLOUR = '#8e44ad';
    var PATTERN_OPTIONS = [['solid', 'solid'], ['pulse', 'pulse'],
                           ['blink', 'blink'], ['comet', 'comet'], ['off', 'off']];
    // Pump strength on a friendly 1-5 dial instead of a raw 0-255 PWM. 1 = the
    // gentlest usable stroke (the calibrated per-skin-type minimum), 5 = full
    // power. Mapped onto the calibrated duty range at runtime (fill_scaling.
    // duty_for_power); 5 is the default and leaves any "over ms" slow-fill acting.
    // Listed 5->1 so the dropdown defaults to its first option, 5 (full) - the
    // historical "full speed" default - with no imperative init needed.
    var POWER_OPTIONS = [['5 (full)', '5'], ['4', '4'], ['3', '3'],
                         ['2', '2'], ['1 (gentle)', '1']];
    // Gesture kinds for the "skip after N gestures" condition: a raw touch (any
    // press, no model needed) or an ML-classified gesture (needs a trained model
    // for the skin type). Kept in sync with gesture_taxonomy.GESTURE_CLASSES
    // (tap / press / compressions) - 'compressions' is the study's active gesture.
    var GESTURE_KINDS = [['a touch', 'touch'], ['a tap', 'tap'],
                         ['a press', 'press'], ['compressions', 'compressions']];

    function init() {
      if (workspace) return;            // both loaders fired - ignore the 2nd
      // Blockly needs a "media" folder (sprites for the trashcan/zoom/dropdown
      // icons + click/delete sounds). Use a vendored ./media/ when present
      // (offline), else the CDN - otherwise those assets 404 ("Failed to
      // fetch") and the icons go missing. Probe a sprite to decide.
      resolveMedia(function (media) {
        if (workspace) return;
        defineBlocks();
        workspace = Blockly.inject('blocklyDiv', {
          media: media,
          toolbox: document.getElementById('toolbox'),
          trashcan: true,
          zoom: { controls: true, wheel: true, startScale: 0.9 },
          grid: { spacing: 20, length: 3, colour: '#eee', snap: true },
        });
        newWorkspace();
      });
    }

    function resolveMedia(cb) {
      // Probe the vendored icon sheet (Blockly 13 ships sprites.svg). Present
      // => use the offline copy; absent => fall back to the CDN media folder.
      var img = new Image();
      img.onload = function () { cb('./media/'); };
      img.onerror = function () { cb('https://unpkg.com/blockly/media/'); };
      img.src = './media/sprites.svg';
    }

    // ---- Block definitions --------------------------------------------
    function defineBlocks() {
      var CH = [['current', 'current'], ['all', 'all'],
                ['0', '0'], ['1', '1'], ['2', '2'], ['3', '3']];
      // LED ring selector. The multiplexed board defines three independent
      // rings (0..2; Tree populates all three, Turtle only ring 0); the direct
      // board has one and ignores higher indices.
      var RING = [['all rings', 'all'], ['ring 0', '0'], ['ring 1', '1'],
                  ['ring 2', '2']];
      // Robot kinds for the `if robot is` / `robot is` blocks (activity_kind.KINDS).
      var ROBOTS = [['Thymio', 'thymio'], ['Turtle', 'turtle'], ['Tree', 'tree']];
      Blockly.defineBlocksWithJsonArray([
        { type: 'se_state',
          message0: 'phase %1', args0: [{ type: 'field_input', name: 'NAME', text: 'phase1' }],
          message1: 'do %1', args1: [{ type: 'input_statement', name: 'DO', check: 'Step' }],
          message2: 'on touch %1', args2: [{ type: 'input_statement', name: 'ONTOUCH', check: 'Step' }],
          message3: 'transitions %1', args3: [{ type: 'input_statement', name: 'TRANSITIONS', check: 'Transition' }],
          previousStatement: 'State', nextStatement: 'State', colour: 290,
          tooltip: 'One phase: actions to run, an optional touch reaction, and transitions out.' },

        { type: 'se_transition',
          message0: 'go to phase %1 when %2',
          args0: [{ type: 'field_input', name: 'TO', text: 'phase2' },
                  { type: 'input_value', name: 'WHEN', check: 'Cond' }],
          previousStatement: 'Transition', nextStatement: 'Transition', colour: 20,
          tooltip: 'Move to another phase when the condition becomes true.' },

        // --- actions ---
        { type: 'se_set_led',
          message0: 'set LED colour %1 pattern %2 period(ms) %3 smooth(ms) %4 angle %5 ring %6',
          args0: [{ type: 'field_input', name: 'COLOR', text: DEFAULT_COLOUR },
                  { type: 'field_dropdown', name: 'PATTERN', options: PATTERN_OPTIONS },
                  { type: 'field_number', name: 'PERIOD', value: 0, min: 0 },
                  { type: 'field_number', name: 'SMOOTH', value: 250, min: 0 },
                  { type: 'field_number', name: 'ANGLE', value: 0, min: 0, max: 360 },
                  { type: 'field_dropdown', name: 'RING', options: RING }],
          previousStatement: 'Step', nextStatement: 'Step', colour: 230,
          tooltip: 'Light a ring. The colour is a "#rrggbb" tag - use '
                 + 'the Colour helper panel on the right to pick one and copy '
                 + 'it. "pattern" comet sweeps a single rotating light. "period" '
                 + 'is the pulse/blink speed or comet revolution in ms (ignored '
                 + 'for solid/off). "smooth" is the cross-fade time of this change '
                 + '(0 snaps). "ring" picks one of the multiplexed board\'s three '
                 + 'rings (0..2) or "all rings"; the direct board has one ring.' },

        { type: 'se_set_led_halves',
          message0: 'set LED halves %1 %2 pattern %3 period(ms) %4 smooth(ms) %5 angle %6 ring %7',
          args0: [{ type: 'field_input', name: 'C1', text: '#8e44ad' },
                  { type: 'field_input', name: 'C2', text: '#f1c40f' },
                  { type: 'field_dropdown', name: 'PATTERN', options: PATTERN_OPTIONS },
                  { type: 'field_number', name: 'PERIOD', value: 0, min: 0 },
                  { type: 'field_number', name: 'SMOOTH', value: 250, min: 0 },
                  { type: 'field_number', name: 'ANGLE', value: 0, min: 0, max: 360 },
                  { type: 'field_dropdown', name: 'RING', options: RING }],
          previousStatement: 'Step', nextStatement: 'Step', colour: 230,
          tooltip: 'Split a ring into two colours (e.g. half purple, half '
                 + 'yellow). Pattern/period animate both halves together; pattern '
                 + 'comet gives one rotating comet per colour (two comets). '
                 + '"smooth" is the cross-fade time; "angle" rotates the split '
                 + 'around the ring (e.g. 90 = top/bottom instead of left/right). '
                 + '"ring" picks one of the multiplexed board\'s three rings.' },

        { type: 'se_set_led_quarters',
          message0: 'set LED quarters %1 %2 %3 %4 pattern %5 period(ms) %6 smooth(ms) %7 angle %8 ring %9',
          args0: [{ type: 'field_input', name: 'C1', text: '#8e44ad' },
                  { type: 'field_input', name: 'C2', text: '#f1c40f' },
                  { type: 'field_input', name: 'C3', text: '#16a085' },
                  { type: 'field_input', name: 'C4', text: '#e74c3c' },
                  { type: 'field_dropdown', name: 'PATTERN', options: PATTERN_OPTIONS },
                  { type: 'field_number', name: 'PERIOD', value: 0, min: 0 },
                  { type: 'field_number', name: 'SMOOTH', value: 250, min: 0 },
                  { type: 'field_number', name: 'ANGLE', value: 0, min: 0, max: 360 },
                  { type: 'field_dropdown', name: 'RING', options: RING }],
          previousStatement: 'Step', nextStatement: 'Step', colour: 230,
          tooltip: 'Split a ring into four colours (quarters). Pattern comet gives '
                 + 'one rotating comet per colour (four comets). "smooth" is the '
                 + 'cross-fade time; "angle" rotates the split around the ring. '
                 + '"ring" picks one of the multiplexed board\'s three rings.' },

        { type: 'se_fade',
          message0: 'fade between %1 and %2 over %3 ms on ring %4',
          args0: [{ type: 'field_input', name: 'C1', text: '#8e44ad' },
                  { type: 'field_input', name: 'C2', text: '#f1c40f' },
                  { type: 'field_number', name: 'PERIOD', value: 2000, min: 200 },
                  { type: 'field_dropdown', name: 'RING', options: RING }],
          previousStatement: 'Step', nextStatement: 'Step', colour: 230,
          tooltip: 'Smoothly cross-fade a ring back and forth between two '
                 + 'colours. Wrap in "repeat forever" for a continuous fade. '
                 + '"ring" picks one of the multiplexed board\'s three rings '
                 + '(0..2) or "all rings".' },

        { type: 'se_touch_progress',
          message0: 'touch fill - %1 arcs, %2 touch(es) each',
          args0: [{ type: 'field_number', name: 'SEGMENTS', value: 4, min: 1, max: 8 },
                  { type: 'field_number', name: 'PER', value: 1, min: 1 }],
          message1: 'from %1 to %2 on ring %3',
          args1: [{ type: 'field_input', name: 'BG', text: '#222222' },
                  { type: 'field_input', name: 'ON', text: '#2ecc71' },
                  { type: 'field_dropdown', name: 'RING', options: RING }],
          message2: 'when full go to phase %1',
          args2: [{ type: 'field_input', name: 'TO', text: '' }],
          previousStatement: 'Step', nextStatement: 'Step', colour: 230,
          tooltip: 'A touch-counter you can see. Put it in a phase\'s "on touch": '
                 + 'every "each" touches lights one more of the ring\'s arcs '
                 + '(4 arcs = quarters), from the "from" colour to the "to" '
                 + 'colour. Once every arc is lit it jumps to the named phase - '
                 + 'leave that blank to just fill and let a transition move on. '
                 + 'Counts touches since the phase started, so it resets each phase.' },

        { type: 'se_inflate',
          message0: 'inflate chamber %1 to %2 %% over %3 ms power %4',
          args0: [{ type: 'field_dropdown', name: 'CHAMBER', options: CH },
                  { type: 'field_number', name: 'PCT', value: 60, min: 0, max: 100 },
                  { type: 'field_number', name: 'PERIOD', value: 0, min: 0 },
                  { type: 'field_dropdown', name: 'POWER', options: POWER_OPTIONS }],
          previousStatement: 'Step', nextStatement: 'Step', colour: 30,
          tooltip: '"over (ms)" optionally fills gently over about that long by '
                 + 'slowing the pump (needs a calibrated fill time). "power" is '
                 + 'the pump strength on a 1-5 dial: 1 = gentlest usable, 5 = full '
                 + '(the default, which leaves "over ms" in charge). Lower it for '
                 + 'a gentler, quieter fill - no calibration needed.' },

        { type: 'se_deflate',
          message0: 'deflate chamber %1',
          args0: [{ type: 'field_dropdown', name: 'CHAMBER', options: CH }],
          previousStatement: 'Step', nextStatement: 'Step', colour: 30 },

        { type: 'se_set_pressure',
          message0: 'set chamber %1 to %2 %% power %3',
          args0: [{ type: 'field_dropdown', name: 'CHAMBER', options: CH },
                  { type: 'field_number', name: 'PCT', value: 0, min: 0, max: 100 },
                  { type: 'field_dropdown', name: 'POWER', options: POWER_OPTIONS }],
          previousStatement: 'Step', nextStatement: 'Step', colour: 30,
          tooltip: 'Set a chamber to an exact fill %. Set it to 0 % to empty '
                 + '(wrinkle) the chamber. "power" is the pump strength on a 1-5 '
                 + 'dial: 1 = gentlest, 5 = full (default).' },

        { type: 'se_stop',
          message0: 'hold all chambers',
          previousStatement: 'Step', nextStatement: 'Step', colour: 30 },

        // --- Thymio wheeled base (no-ops on robots without wheels; wrap in
        // "if robot is Thymio" so the Turtle/Tree skip it explicitly) ---
        { type: 'se_thymio_drive',
          message0: 'drive Thymio - left wheel %1 right wheel %2 for %3 ms',
          args0: [{ type: 'field_number', name: 'LEFT', value: 100, min: -500, max: 500 },
                  { type: 'field_number', name: 'RIGHT', value: 100, min: -500, max: 500 },
                  { type: 'field_number', name: 'MS', value: 1000, min: 0 }],
          previousStatement: 'Step', nextStatement: 'Step', colour: 160,
          tooltip: 'Set the Thymio wheel speeds (-500..500; negative = backwards, '
                 + 'opposite signs turn on the spot). "for N ms" drives that long '
                 + 'then stops; 0 keeps driving until the next drive block. '
                 + '0 / 0 stops the wheels.' },

        { type: 'se_thymio_leds',
          message0: 'Thymio top LED colour %1',
          args0: [{ type: 'field_input', name: 'COLOR', text: DEFAULT_COLOUR }],
          previousStatement: 'Step', nextStatement: 'Step', colour: 160,
          tooltip: 'Colour the Thymio\'s top LED. The colour is a "#rrggbb" tag - '
                 + 'use the Colour helper panel to pick one and copy it.' },

        { type: 'se_thymio_sound',
          message0: 'Thymio sound - system %1 or tone %2 Hz for %3 ms or SD track %4',
          args0: [{ type: 'field_number', name: 'SYS', value: 2, min: -1, max: 7 },
                  { type: 'field_number', name: 'FREQ', value: 0, min: 0 },
                  { type: 'field_number', name: 'DUR', value: 200, min: 0 },
                  { type: 'field_number', name: 'TRACK', value: -1, min: -1 }],
          previousStatement: 'Step', nextStatement: 'Step', colour: 160,
          tooltip: 'Play a sound. "SD track" >= 0 plays a recording off the microSD '
                 + '(needs a card) and wins. Else a "tone Hz" > 0 plays that tone for '
                 + '"for N ms"; else the built-in system sound (0-7; -1 stops). The '
                 + 'wheels keep driving through the sound.' },

        // --- control ---
        { type: 'se_wait',
          message0: 'wait %1 ms', args0: [{ type: 'field_number', name: 'MS', value: 500, min: 0 }],
          previousStatement: 'Step', nextStatement: 'Step', colour: 120 },

        { type: 'se_wait_for_touch',
          message0: 'wait for touch on chamber %1',
          args0: [{ type: 'field_dropdown', name: 'CHAMBER',
                   options: [['any', 'current'], ['0', '0'], ['1', '1'], ['2', '2'], ['3', '3']] }],
          previousStatement: 'Step', nextStatement: 'Step', colour: 120 },

        { type: 'se_for_each',
          message0: 'for each chamber',
          message1: 'do %1', args1: [{ type: 'input_statement', name: 'DO', check: 'Step' }],
          previousStatement: 'Step', nextStatement: 'Step', colour: 120 },

        { type: 'se_if_robot',
          message0: 'if robot is %1',
          args0: [{ type: 'field_dropdown', name: 'ROBOT', options: ROBOTS }],
          message1: 'do %1', args1: [{ type: 'input_statement', name: 'DO', check: 'Step' }],
          message2: 'else %1', args2: [{ type: 'input_statement', name: 'ELSE', check: 'Step' }],
          previousStatement: 'Step', nextStatement: 'Step', colour: 120,
          tooltip: 'Run "do" only when the session robot is the chosen kind, '
                 + 'else run "else". This is how one behaviour covers every '
                 + 'robot - e.g. put the Thymio drive blocks under '
                 + '"if robot is Thymio" and the Turtle/Tree skip them. '
                 + 'Chain another "if robot is" inside "else" for 3 ways.' },

        // --- conditions ---
        { type: 'se_elapsed',
          message0: 'after %1 ms', args0: [{ type: 'field_number', name: 'MS', value: 120000, min: 0 }],
          output: 'Cond', colour: 20 },

        { type: 'se_touch_count',
          message0: 'touched at least %1 times', args0: [{ type: 'field_number', name: 'MIN', value: 15, min: 1 }],
          output: 'Cond', colour: 20 },

        { type: 'se_gesture_count',
          message0: 'after %1 %2 times',
          args0: [{ type: 'field_dropdown', name: 'KIND', options: GESTURE_KINDS },
                  { type: 'field_number', name: 'MIN', value: 3, min: 1 }],
          output: 'Cond', colour: 20,
          tooltip: 'True once the child made this gesture at least N times in the '
                 + 'phase. "a touch" counts any press (no model needed); the rest '
                 + '(tap / press / compressions) are ML gestures and need a trained '
                 + 'touch model for the skin type, else they never fire. Pair it '
                 + 'with a "go to phase" transition to skip after N gestures.' },

        { type: 'se_on_impact',
          message0: 'Thymio hit at least %1 times, at least %2',
          args0: [{ type: 'field_number', name: 'MIN', value: 1, min: 1 },
                  { type: 'field_dropdown', name: 'LEVEL',
                    options: [['a touch', '1'], ['a knock', '2'], ['a slap', '3']] }],
          output: 'Cond', colour: 20,
          tooltip: 'True once the Thymio was hit at least N times in this phase, at '
                 + 'the chosen intensity or harder (touch < knock < slap). Needs the '
                 + 'gateway/C6 wireless link; robots without impact sensing never fire it.' },

        { type: 'se_on_lifted',
          message0: 'Thymio lifted at least %1 times', args0: [{ type: 'field_number', name: 'MIN', value: 1, min: 1 }],
          output: 'Cond', colour: 20,
          tooltip: 'True once the Thymio was lifted off the table at least N times in '
                 + 'this phase (its ground sensors stop seeing the surface). Needs the '
                 + 'gateway/C6 wireless link; robots without ground sensing never fire it.' },

        { type: 'se_organs',
          message0: 'organs %1 good %2 %3 bad %4 %5',
          args0: [{ type: 'field_dropdown', name: 'SCOPE',
                    options: [['by count', 'count'], ['all good', 'all_good'], ['all bad', 'all_bad']] },
                  { type: 'field_dropdown', name: 'GOOD_OP',
                    options: [['>=', '>='], ['<=', '<='], ['=', '==']] },
                  { type: 'field_number', name: 'GOOD', value: 3, min: 0 },
                  { type: 'field_dropdown', name: 'BAD_OP',
                    options: [['>=', '>='], ['<=', '<='], ['=', '==']] },
                  { type: 'field_number', name: 'BAD', value: 0, min: 0 }],
          output: 'Cond', colour: 20,
          tooltip: 'Organ status (good/bad organs plugged into the skin). '
                 + '"by count" uses the good/bad comparisons; "all good" / '
                 + '"all bad" mean every organ matches and ignore the numbers.' },

        { type: 'se_any',
          message0: 'any of: %1 %2 %3',
          args0: [{ type: 'input_dummy' },
                  { type: 'input_value', name: 'A', check: 'Cond' },
                  { type: 'input_value', name: 'B', check: 'Cond' }],
          output: 'Cond', colour: 20 },

        { type: 'se_all',
          message0: 'all of: %1 %2 %3',
          args0: [{ type: 'input_dummy' },
                  { type: 'input_value', name: 'A', check: 'Cond' },
                  { type: 'input_value', name: 'B', check: 'Cond' }],
          output: 'Cond', colour: 20 },

        { type: 'se_not',
          message0: 'not %1', args0: [{ type: 'input_value', name: 'C', check: 'Cond' }],
          output: 'Cond', colour: 20 },

        { type: 'se_robot_is',
          message0: 'robot is %1',
          args0: [{ type: 'field_dropdown', name: 'ROBOT', options: ROBOTS }],
          output: 'Cond', colour: 20,
          tooltip: 'True when the session robot is the chosen kind - lets a '
                 + 'phase transition fire only on one robot.' },

        { type: 'se_always',
          message0: 'always', output: 'Cond', colour: 20 },
      ]);

      defineBehaviourBlock();
      defineBeatBlock();
      defineRepeatBlock();
    }

    // ---- behaviour root: declares the target skin condition -------------
    // The "for skin" dropdown is the activity's target (spec.target.skin).
    // One behaviour covers every robot - robot-specific parts go inside
    // "if robot is ..." blocks - and the session pre-selects the activity that
    // matches the skins the robots are dressed in. 'any' = target-less.
    function defineBehaviourBlock() {
      Blockly.Blocks['se_behaviour'] = {
        init: function () {
          this.appendDummyInput()
            .appendField('behaviour for skin')
            .appendField(new Blockly.FieldDropdown([
              ['any skin', 'any'],
              ['Natural', 'natural'],
              ['Wrinkles', 'wrinkles'],
              ['Organs', 'organs'],
            ]), 'SKIN');
          this.appendStatementInput('STATES')
            .setCheck('State')
            .appendField('- starts at the first phase');
          this.setColour(290);
          this.setTooltip(
            'Root of a behaviour. Stack phases inside. "for skin" declares '
            + 'which skin set the activity is written for (Natural / Wrinkles '
            + '/ Organs); the session pre-selects the matching activity and '
            + 'warns when a robot wears different skins. The behaviour runs '
            + 'on ANY robot - wrap robot-specific parts (e.g. the Thymio '
            + 'wheels) in "if robot is ..." blocks.');
        },
      };
    }

    // When a loaded spec carries a target, push its skin condition into the
    // root block ('any' when absent or legacy robot-kind-targeted).
    function syncTargetUi(spec) {
      var roots = workspace.getBlocksByType('se_behaviour', false);
      if (!roots.length) return;
      var skin = (spec && spec.target && spec.target.skin) || 'any';
      if (spec && spec.target && spec.target.kind && !spec.target.skin) {
        console.warn('legacy robot-kind target', spec.target.kind,
                     '- re-save to convert to a skin target');
      }
      try { roots[0].setFieldValue(skin, 'SKIN'); }
      catch (e) { console.warn('target skin', skin, e); }
    }

    // ---- beat: a block whose fields change with the chosen mode --------
    // "beat" was the one block nobody could read, so it is built by hand to
    // (a) spell each mode out in plain words and (b) hide the "soft chambers"
    // row unless the mode actually uses it.
    function defineBeatBlock() {
      Blockly.Blocks['se_beat'] = {
        init: function () {
          var self = this;
          this.appendDummyInput()
            .appendField('beat -')
            .appendField(new Blockly.FieldDropdown([
              ['all chambers together', 'sync'],
              ['one chamber at a time', 'sequential'],
              ['chambers in random order', 'random'],
              ['some strong, the rest soft', 'aligned'],
            ], function (mode) { self.updateShape_(mode); return mode; }), 'MODE');
          this.appendDummyInput()
            .appendField('strength')
            .appendField(new Blockly.FieldNumber(60, 0, 100), 'PCT')
            .appendField('%');
          this.appendDummyInput('SOFT_ROW')
            .appendField('soft chambers at')
            .appendField(new Blockly.FieldNumber(20, 0, 100), 'PCT2')
            .appendField('% , how many strong')
            .appendField(new Blockly.FieldNumber(2, 0), 'ALIGNED');
          this.appendDummyInput()
            .appendField('one cycle every')
            .appendField(new Blockly.FieldNumber(2000, 100), 'PERIOD')
            .appendField('ms , power')
            .appendField(new Blockly.FieldDropdown(POWER_OPTIONS), 'POWER');
          this.setPreviousStatement(true, 'Step');
          this.setNextStatement(true, 'Step');
          this.setColour(30);
          this.setTooltip(
            'One heartbeat cycle across the chambers - wrap it in '
            + '"repeat forever" for a continuous beat. "strength" is the peak '
            + 'fill %. Only "some strong, the rest soft" uses the soft-chamber '
            + 'row (those chambers beat to the soft %, the rest to strength). '
            + '"power" is the pump strength on a 1-5 dial (1 = gentlest, '
            + '5 = full) for the up-strokes; the release stays full speed.');
          this.updateShape_(this.getFieldValue('MODE'));
        },
        updateShape_: function (mode) {
          var row = this.getInput('SOFT_ROW');
          if (row) row.setVisible(mode === 'aligned');
          if (this.rendered) this.render();
        },
        saveExtraState: function () {
          return { mode: this.getFieldValue('MODE') };
        },
        loadExtraState: function (state) {
          this.updateShape_(state && state.mode);
        },
      };
    }

    // ---- repeat: hide the count when looping forever ------------------
    // "forever" ignores any count, so the "N =" box only makes sense in the
    // "N times" mode; it is built by hand so that box can disappear instead
    // of sitting there confusingly when the loop runs forever.
    function defineRepeatBlock() {
      Blockly.Blocks['se_repeat'] = {
        init: function () {
          var self = this;
          this.appendDummyInput()
            .appendField('repeat')
            .appendField(new Blockly.FieldDropdown([
              ['forever', 'forever'],
              ['N times', 'times'],
            ], function (mode) { self.updateShape_(mode); return mode; }), 'MODE');
          this.appendDummyInput('TIMES_ROW')
            .appendField('N =')
            .appendField(new Blockly.FieldNumber(4, 1), 'TIMES');
          this.appendStatementInput('DO')
            .setCheck('Step')
            .appendField('do');
          this.setPreviousStatement(true, 'Step');
          this.setNextStatement(true, 'Step');
          this.setColour(120);
          this.setTooltip(
            'Repeat the nested steps forever, or a set number of times (N). '
            + 'The "N =" box only appears when you pick "N times".');
          this.updateShape_(this.getFieldValue('MODE'));
        },
        updateShape_: function (mode) {
          var row = this.getInput('TIMES_ROW');
          if (row) row.setVisible(mode === 'times');
          if (this.rendered) this.render();
        },
        saveExtraState: function () {
          return { mode: this.getFieldValue('MODE') };
        },
        loadExtraState: function (state) {
          this.updateShape_(state && state.mode);
        },
      };
    }

    // ---- Compile workspace -> spec ------------------------------------
    function num(b, f) { return Number(b.getFieldValue(f)); }

    // The 1-5 "power" dial. 5 (full) is the default and means "no explicit duty
    // - full speed, letting any 'over ms' slow-fill act", so omit it to keep
    // specs clean and back-compatible. 1-4 carry an explicit gentler power the
    // runtime maps onto the skin type's calibrated duty range.
    function withPower(obj, b) {
      var p = num(b, 'POWER');
      if (p && p < 5) obj.power = p;
      return obj;
    }

    // 'all' rings is the default whole-ring behaviour, so omit it to keep
    // specs clean (and back-compatible with behaviours authored before rings).
    function withRing(obj, b) {
      var r = b.getFieldValue('RING');
      if (r && r !== 'all') obj.ring = r;
      return obj;
    }

    function stepsFromStack(block) {
      var out = [];
      while (block) {
        var o = stepToObj(block);
        if (o) out.push(o);
        block = block.getNextBlock();
      }
      return out;
    }

    function stepToObj(b) {
      switch (b.type) {
        case 'se_set_led':
          return { set_led: withRing({ color: b.getFieldValue('COLOR'),
                              pattern: b.getFieldValue('PATTERN'),
                              period_ms: num(b, 'PERIOD'),
                              fade_ms: num(b, 'SMOOTH'),
                              angle: num(b, 'ANGLE') }, b) };
        case 'se_set_led_halves':
          return { set_led_halves: withRing({ colors: [b.getFieldValue('C1'), b.getFieldValue('C2')],
                                     pattern: b.getFieldValue('PATTERN'),
                                     period_ms: num(b, 'PERIOD'),
                                     fade_ms: num(b, 'SMOOTH'),
                                     angle: num(b, 'ANGLE') }, b) };
        case 'se_set_led_quarters':
          return { set_led_halves: withRing({ colors: [b.getFieldValue('C1'), b.getFieldValue('C2'),
                                              b.getFieldValue('C3'), b.getFieldValue('C4')],
                                     pattern: b.getFieldValue('PATTERN'),
                                     period_ms: num(b, 'PERIOD'),
                                     fade_ms: num(b, 'SMOOTH'),
                                     angle: num(b, 'ANGLE') }, b) };
        case 'se_fade':
          return { fade: withRing({ color1: b.getFieldValue('C1'), color2: b.getFieldValue('C2'),
                           period_ms: num(b, 'PERIOD') }, b) };
        case 'se_touch_progress': {
          var tp = withRing({ segments: num(b, 'SEGMENTS'), per: num(b, 'PER'),
                              on_color: b.getFieldValue('ON'),
                              bg_color: b.getFieldValue('BG') }, b);
          var tpTo = (b.getFieldValue('TO') || '').trim();
          if (tpTo) tp.to = tpTo;
          return { touch_progress: tp };
        }
        case 'se_beat':
          return { beat: withPower({ mode: b.getFieldValue('MODE'), pct: num(b, 'PCT'),
                           pct2: num(b, 'PCT2'), aligned: num(b, 'ALIGNED'),
                           period_ms: num(b, 'PERIOD') }, b) };
        case 'se_inflate':
          return { inflate: withPower({ chamber: b.getFieldValue('CHAMBER'), pct: num(b, 'PCT'),
                              period_ms: num(b, 'PERIOD') }, b) };
        case 'se_deflate':
          return { deflate: { chamber: b.getFieldValue('CHAMBER') } };
        case 'se_set_pressure':
          return { set_pressure: withPower({ chamber: b.getFieldValue('CHAMBER'), pct: num(b, 'PCT') }, b) };
        case 'se_stop':
          return { stop: {} };
        case 'se_thymio_drive':
          return { thymio_drive: { left: num(b, 'LEFT'), right: num(b, 'RIGHT'),
                                   ms: num(b, 'MS') } };
        case 'se_thymio_leds':
          return { thymio_leds: { color: b.getFieldValue('COLOR') } };
        case 'se_thymio_sound':
          return { thymio_sound: { sys: num(b, 'SYS'), freq: num(b, 'FREQ'),
                                   dur: num(b, 'DUR'), track: num(b, 'TRACK') } };
        case 'se_wait':
          return { wait: { ms: num(b, 'MS') } };
        case 'se_wait_for_touch':
          return { wait_for_touch: { chamber: b.getFieldValue('CHAMBER') } };
        case 'se_repeat': {
          var o = { do: stepsFromStack(b.getInputTargetBlock('DO')) };
          if (b.getFieldValue('MODE') === 'forever') o.forever = true;
          else o.times = num(b, 'TIMES');
          return { repeat: o };
        }
        case 'se_for_each':
          return { for_each_chamber: { do: stepsFromStack(b.getInputTargetBlock('DO')) } };
        case 'se_if_robot':
          return { if_robot: { robot: b.getFieldValue('ROBOT'),
                               do: stepsFromStack(b.getInputTargetBlock('DO')),
                               else: stepsFromStack(b.getInputTargetBlock('ELSE')) } };
        default:
          return null;
      }
    }

    function condToObj(b) {
      if (!b) return { always: true };
      switch (b.type) {
        case 'se_elapsed':     return { elapsed_ms: num(b, 'MS') };
        case 'se_touch_count': return { touch_count: { min: num(b, 'MIN') } };
        case 'se_gesture_count': return { gesture_count: { kind: b.getFieldValue('KIND'),
                                                           min: num(b, 'MIN') } };
        case 'se_on_impact':   return { on_impact: { min: num(b, 'MIN'),
                                                     level: num(b, 'LEVEL') } };
        case 'se_on_lifted':   return { on_lifted: { min: num(b, 'MIN') } };
        case 'se_organs':      return { organs: { scope: b.getFieldValue('SCOPE'),
                                                  good_op: b.getFieldValue('GOOD_OP'), good: num(b, 'GOOD'),
                                                  bad_op: b.getFieldValue('BAD_OP'), bad: num(b, 'BAD') } };
        case 'se_any':         return { any: [condToObj(b.getInputTargetBlock('A')),
                                              condToObj(b.getInputTargetBlock('B'))] };
        case 'se_all':         return { all: [condToObj(b.getInputTargetBlock('A')),
                                              condToObj(b.getInputTargetBlock('B'))] };
        case 'se_not':         return { not: condToObj(b.getInputTargetBlock('C')) };
        case 'se_robot_is':    return { robot_is: { robot: b.getFieldValue('ROBOT') } };
        default:               return { always: true };
      }
    }

    function transitionsFromStack(block) {
      var out = [];
      while (block) {
        out.push({ to: block.getFieldValue('TO'),
                   when: condToObj(block.getInputTargetBlock('WHEN')) });
        block = block.getNextBlock();
      }
      return out;
    }

    function getSpec() {
      var roots = workspace.getBlocksByType('se_behaviour', false);
      var states = {}, initial = null, skin = null;
      if (roots.length) {
        skin = roots[0].getFieldValue('SKIN');
        var s = roots[0].getInputTargetBlock('STATES');
        while (s) {
          var name = s.getFieldValue('NAME');
          if (initial === null) initial = name;
          states[name] = {
            do: stepsFromStack(s.getInputTargetBlock('DO')),
            on_touch: stepsFromStack(s.getInputTargetBlock('ONTOUCH')),
            transitions: transitionsFromStack(s.getInputTargetBlock('TRANSITIONS')),
          };
          s = s.getNextBlock();
        }
      }
      // _blockly carries the exact workspace so the editor can round-trip; the
      // runtime/validator ignore unknown top-level keys.
      var spec = { initial: initial, states: states,
                   _blockly: Blockly.serialization.workspaces.save(workspace) };
      // 'any' = target-less behaviour: omit the key entirely.
      if (skin && skin !== 'any') spec.target = { skin: skin };
      return JSON.stringify(spec);
    }

    // ---- Load / reset -------------------------------------------------
    function loadSpec(json) {
      try {
        var spec = (typeof json === 'string') ? JSON.parse(json) : json;
        if (spec && spec._blockly) {
          Blockly.serialization.workspaces.load(spec._blockly, workspace);
          renderAllBlocks();
          syncTargetUi(spec);
          return;
        }
        // A hand-authored or imported spec carries no _blockly workspace blob.
        // Rebuild the blocks from the spec itself so it is visible, editable and
        // re-saveable (otherwise the editor would open blank and Save would
        // overwrite the import with an empty behaviour).
        if (spec && spec.states) {
          buildBlocksFromSpec(spec);
          return;
        }
      } catch (e) {
        console.warn('loadSpec failed, starting fresh:', e);
      }
      newWorkspace();
    }

    // ---- Rebuild blocks from a bare spec (inverse of getSpec) ----------
    function newStepBlock(type) {
      var b = workspace.newBlock(type);
      b.initSvg();
      return b;
    }

    function setF(b, name, val) {
      if (val === undefined || val === null) return;
      try { b.setFieldValue(String(val), name); }
      catch (e) { console.warn('setFieldValue', name, val, e); }
    }

    // Set the 1-5 power dropdown from a spec: an explicit 'power', or a legacy
    // raw 'duty' converted to the nearest level (floor ~190 -> 1, 255 -> 5), else
    // the default 5 (full).
    function setPower(b, p) {
      if (!p) return;
      if (p.power != null) { setF(b, 'POWER', String(p.power)); return; }
      if (p.duty) {
        var MIN = 190, span = 255 - MIN;
        var duty = Math.max(MIN, Math.min(255, p.duty));
        var lvl = 1 + Math.round((duty - MIN) / span * 4);
        setF(b, 'POWER', String(Math.max(1, Math.min(5, lvl))));
      }
    }

    function connectStack(parent, inputName, firstChild) {
      if (firstChild) {
        parent.getInput(inputName).connection.connect(firstChild.previousConnection);
      }
    }

    function connectCond(parent, inputName, child) {
      if (child && child.outputConnection) {
        parent.getInput(inputName).connection.connect(child.outputConnection);
      }
    }

    // Build a statement stack from an array of steps; return its first block.
    function buildStack(steps) {
      var first = null, prev = null;
      (steps || []).forEach(function (step) {
        var b = buildStep(step);
        if (!b) return;
        if (prev) prev.nextConnection.connect(b.previousConnection);
        else first = b;
        prev = b;
      });
      return first;
    }

    function buildStep(step) {
      if (!step || typeof step !== 'object') return null;
      var verb = Object.keys(step)[0];
      var p = step[verb];
      if (!p || typeof p !== 'object') p = { _value: p };
      var b;
      switch (verb) {
        case 'set_led':
          b = newStepBlock('se_set_led');
          setF(b, 'COLOR', p.color); setF(b, 'PATTERN', p.pattern);
          setF(b, 'PERIOD', p.period_ms); setF(b, 'SMOOTH', p.fade_ms);
          setF(b, 'ANGLE', p.angle); setF(b, 'RING', p.ring); break;
        case 'set_led_halves':
          var cols = p.colors || [];
          if (cols.length >= 4) {            // four colours rebuild as the quarters block
            b = newStepBlock('se_set_led_quarters');
            setF(b, 'C1', cols[0]); setF(b, 'C2', cols[1]);
            setF(b, 'C3', cols[2]); setF(b, 'C4', cols[3]);
          } else {
            b = newStepBlock('se_set_led_halves');
            setF(b, 'C1', cols[0]); setF(b, 'C2', cols[1]);
          }
          setF(b, 'PATTERN', p.pattern); setF(b, 'PERIOD', p.period_ms);
          setF(b, 'SMOOTH', p.fade_ms); setF(b, 'ANGLE', p.angle);
          setF(b, 'RING', p.ring); break;
        case 'fade':
          b = newStepBlock('se_fade');
          setF(b, 'C1', p.color1); setF(b, 'C2', p.color2);
          setF(b, 'PERIOD', p.period_ms); setF(b, 'RING', p.ring); break;
        case 'beat':
          b = newStepBlock('se_beat');
          setF(b, 'MODE', p.mode);
          if (b.updateShape_) b.updateShape_(p.mode);
          setF(b, 'PCT', p.pct); setF(b, 'PCT2', p.pct2);
          setF(b, 'ALIGNED', p.aligned); setF(b, 'PERIOD', p.period_ms);
          setPower(b, p); break;
        case 'touch_progress':
          b = newStepBlock('se_touch_progress');
          setF(b, 'SEGMENTS', p.segments != null ? p.segments : 4);
          setF(b, 'PER', p.per != null ? p.per : 1);
          setF(b, 'ON', p.on_color != null ? p.on_color : '#2ecc71');
          setF(b, 'BG', p.bg_color != null ? p.bg_color : '#222222');
          setF(b, 'RING', p.ring);
          setF(b, 'TO', p.to != null ? p.to : ''); break;
        case 'inflate':
          b = newStepBlock('se_inflate');
          setF(b, 'CHAMBER', p.chamber); setF(b, 'PCT', p.pct);
          setF(b, 'PERIOD', p.period_ms); setPower(b, p); break;
        case 'deflate':
          b = newStepBlock('se_deflate'); setF(b, 'CHAMBER', p.chamber); break;
        case 'set_pressure': case 'wrinkle':
          b = newStepBlock('se_set_pressure');
          setF(b, 'CHAMBER', p.chamber);
          setF(b, 'PCT', verb === 'wrinkle' ? 0 : p.pct);
          setPower(b, p); break;
        case 'stop': b = newStepBlock('se_stop'); break;
        case 'thymio_drive':
          b = newStepBlock('se_thymio_drive');
          setF(b, 'LEFT', p.left); setF(b, 'RIGHT', p.right);
          setF(b, 'MS', p.ms); break;
        case 'thymio_leds':
          b = newStepBlock('se_thymio_leds'); setF(b, 'COLOR', p.color); break;
        case 'thymio_sound':
          b = newStepBlock('se_thymio_sound');
          setF(b, 'SYS', p.sys != null ? p.sys : 2);
          setF(b, 'FREQ', p.freq != null ? p.freq : 0);
          setF(b, 'DUR', p.dur != null ? p.dur : 200);
          setF(b, 'TRACK', p.track != null ? p.track : -1); break;
        case 'wait':
          b = newStepBlock('se_wait');
          setF(b, 'MS', p.ms != null ? p.ms : p._value); break;
        case 'wait_for_touch':
          b = newStepBlock('se_wait_for_touch');
          setF(b, 'CHAMBER', p.chamber != null ? p.chamber : 'current'); break;
        case 'repeat':
          b = newStepBlock('se_repeat');
          if (p.forever || p.times == null) setF(b, 'MODE', 'forever');
          else { setF(b, 'MODE', 'times'); setF(b, 'TIMES', p.times); }
          connectStack(b, 'DO', buildStack(p.do)); break;
        case 'for_each_chamber':
          b = newStepBlock('se_for_each');
          connectStack(b, 'DO', buildStack(p.do)); break;
        case 'if_robot':
          b = newStepBlock('se_if_robot');
          setF(b, 'ROBOT', p.robot);
          connectStack(b, 'DO', buildStack(p.do));
          connectStack(b, 'ELSE', buildStack(p['else'])); break;
        default: return null;
      }
      return b;
    }

    function buildCond(cond) {
      if (!cond || typeof cond !== 'object') return newStepBlock('se_always');
      var name = Object.keys(cond)[0];
      var v = cond[name];
      if (name === 'or') name = 'any';
      if (name === 'and') name = 'all';
      var b;
      switch (name) {
        case 'elapsed_ms':
          b = newStepBlock('se_elapsed');
          setF(b, 'MS', (v && v.ms != null) ? v.ms : v); break;
        case 'touch_count':
          b = newStepBlock('se_touch_count');
          setF(b, 'MIN', (v && v.min != null) ? v.min : v); break;
        case 'gesture_count':
          b = newStepBlock('se_gesture_count');
          setF(b, 'KIND', (v && v.kind != null) ? v.kind : 'touch');
          setF(b, 'MIN', (v && v.min != null) ? v.min : v); break;
        case 'on_impact': {
          b = newStepBlock('se_on_impact');
          var im = (v && v.min != null) ? v.min : v;
          setF(b, 'MIN', im == null ? 1 : im);
          setF(b, 'LEVEL', String((v && v.level != null) ? v.level : 1)); break;
        }
        case 'on_lifted': {
          b = newStepBlock('se_on_lifted');
          var lf = (v && v.min != null) ? v.min : v;
          setF(b, 'MIN', lf == null ? 1 : lf); break;
        }
        case 'organs':
          b = newStepBlock('se_organs'); v = v || {};
          setF(b, 'SCOPE', v.scope); setF(b, 'GOOD_OP', v.good_op);
          setF(b, 'GOOD', v.good); setF(b, 'BAD_OP', v.bad_op);
          setF(b, 'BAD', v.bad); break;
        case 'any':
          b = newStepBlock('se_any');
          connectCond(b, 'A', buildCond((v || [])[0]));
          connectCond(b, 'B', buildCond((v || [])[1])); break;
        case 'all':
          b = newStepBlock('se_all');
          connectCond(b, 'A', buildCond((v || [])[0]));
          connectCond(b, 'B', buildCond((v || [])[1])); break;
        case 'not':
          b = newStepBlock('se_not'); connectCond(b, 'C', buildCond(v)); break;
        case 'robot_is':
          b = newStepBlock('se_robot_is');
          setF(b, 'ROBOT', (v && v.robot != null) ? v.robot : v); break;
        default:
          b = newStepBlock('se_always'); break;
      }
      return b;
    }

    function buildTransitions(transitions) {
      var first = null, prev = null;
      (transitions || []).forEach(function (tr) {
        var b = newStepBlock('se_transition');
        setF(b, 'TO', tr.to);
        connectCond(b, 'WHEN', buildCond(tr.when));
        if (prev) prev.nextConnection.connect(b.previousConnection);
        else first = b;
        prev = b;
      });
      return first;
    }

    function buildBlocksFromSpec(spec) {
      workspace.clear();
      var root = newStepBlock('se_behaviour');
      if (spec.target && spec.target.skin) setF(root, 'SKIN', spec.target.skin);
      root.moveBy(30, 30);
      var states = spec.states || {};
      var order = Object.keys(states);
      // Keep the declared initial phase first, so the editor's "starts at the
      // first phase" matches the spec's initial state.
      if (spec.initial && order.indexOf(spec.initial) > 0) {
        order = [spec.initial].concat(order.filter(function (n) {
          return n !== spec.initial;
        }));
      }
      var prevState = null;
      order.forEach(function (name) {
        var st = states[name] || {};
        var sb = newStepBlock('se_state');
        setF(sb, 'NAME', name);
        connectStack(sb, 'DO', buildStack(st.do));
        connectStack(sb, 'ONTOUCH', buildStack(st.on_touch));
        connectStack(sb, 'TRANSITIONS', buildTransitions(st.transitions));
        if (prevState) prevState.nextConnection.connect(sb.previousConnection);
        else connectStack(root, 'STATES', sb);
        prevState = sb;
      });
      root.render();
      renderAllBlocks();
      syncTargetUi(spec);
    }

    // After a programmatic deserialize, Blockly 13 can leave nested blocks
    // unmeasured (width/height 0) so only the last phase's body renders and the
    // earlier phases look empty. Queue a render on EVERY block (not just the
    // top-level one) and flush, so the whole tree lays out.
    function renderAllBlocks() {
      try {
        workspace.getAllBlocks(false).forEach(function (b) {
          if (b.queueRender) b.queueRender();
        });
        var rm = Blockly.renderManagement;
        if (rm && rm.triggerQueuedRenders) rm.triggerQueuedRenders();
      } catch (e) {
        console.warn('renderAllBlocks failed:', e);
      }
    }

    function newWorkspace() {
      if (!workspace) return;
      workspace.clear();
      var root = workspace.newBlock('se_behaviour');
      var st = workspace.newBlock('se_state');
      root.initSvg(); st.initSvg();
      root.getInput('STATES').connection.connect(st.previousConnection);
      root.moveBy(30, 30);
      root.render();
    }
  </script>
</body>
</html>
