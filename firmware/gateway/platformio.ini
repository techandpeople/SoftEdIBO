; SoftEdIBO gateway — bridges PC (USB serial) <-> ESP-NOW (nodes), on a
; Seeed XIAO ESP32-S3. One build does everything: ESP-NOW chamber control + a SoftAP
; for the Thymios / WiFi-OTA (-DGATEWAY_AP) + a UART link to a companion XIAO ESP32-C6
; that speaks 802.15.4 to Thymio robots (-DGATEWAY_THYMIO).
;
; The C6 UART link: PC lines {"target":"thymio",...} are forwarded to the C6 (S3 D6/TX
; GPIO43 -> C6 D7/RX; S3 D7/RX GPIO44 <- C6 D6/TX; common GND; S3 5V -> C6 5V); the C6's
; replies come back tagged {"source":"thymio",...}. Flash the paired C6 from
; firmware/thymio_rcp (rcp_c6). The SoftAP (default SSID "SoftEdIBO" / pass "softedibo",
; channel 1; override -DGATEWAY_AP_SSID/_PASS/_CHANNEL) also serves the WiFi-OTA image at
; /fw so the sealed C6 updates itself over WiFi (no USB). PSRAM (sdkconfig.defaults.esp32s3)
; buffers that image. See docs/THYMIO_WIRELESS_CONTROL.md.

[env]
monitor_speed = 115200

; --- ESP-IDF gateway base (Seeed XIAO ESP32-S3, native USB-Serial/JTAG) ---
;
; ESP-IDF 5.x. The official PlatformIO `espressif32` platform (6.x) ships Arduino core
; 2.x, so we pin the pioarduino fork (verified: IDF 5.5.4). Pin an exact release tag,
; never "stable": that alias's zip asset is mutated in place, so a CI toolchain cache
; built against an older "stable" download can end up mismatched with a newer one
; under the same URL — bump this tag deliberately when needed (kept in sync with
; firmware/thymio_rcp/platformio.ini, the other pioarduino consumer).
; Native ESP-IDF also works (shared CMakeLists.txt):
;     cd firmware/gateway && idf.py set-target esp32s3 && idf.py build
[espidf_base]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = espidf

; --- Seeed XIAO ESP32-S3 gateway — the one build, all features ---
[env:seeed_xiao_esp32s3]
extends     = espidf_base
board       = seeed_xiao_esp32s3
build_flags = -DGATEWAY_AP -DGATEWAY_THYMIO
