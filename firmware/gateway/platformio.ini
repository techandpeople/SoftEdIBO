; SoftEdIBO ESP-NOW gateway — bridges PC (USB serial) <-> ESP-NOW (nodes).
;
; THREE board variants are supported (same serial protocol, shared se_espnow.h):
;   seeed_xiao_esp32c6 -> src/main.cpp         (ESP-IDF, Seeed XIAO ESP32-C6)
;   seeed_xiao_esp32s3 -> src/main.cpp         (ESP-IDF, Seeed XIAO ESP32-S3)
;   esp32dev           -> src/main_arduino.cpp (Arduino, classic ESP32-WROOM-32)
;
; Each env compiles only its own entry point:
;   - the espidf envs build main.cpp via src/CMakeLists.txt (main_arduino.cpp
;     is not in its SRCS, so it is ignored);
;   - the arduino env excludes main.cpp via build_src_filter.
;
; The XIAO ESP32-S3 (Xtensa dual-core, more RAM) is the preferred gateway: it
; shares the C6's native USB-Serial/JTAG (same firmware) but has the headroom to
; also run a SoftAP for the Thymios alongside ESP-NOW. The C6 build stays as a
; lower-cost option.

[env]
monitor_speed = 115200

; --- ESP-IDF gateway base (Seeed XIAO, native USB-Serial/JTAG) ---
;
; The XIAO C6 (RISC-V) and S3 (Xtensa) both need ESP-IDF 5.x. The official
; PlatformIO `espressif32` platform (6.x) ships Arduino core 2.x and does NOT
; support the C6 with the espidf framework, so we pin the pioarduino fork
; (verified: IDF 5.5.4). The `stable` tag tracks the latest release; pin a tag
; (e.g. .../download/55.03.38/) for full reproducibility. Native ESP-IDF also
; works (shared CMakeLists.txt):
;     cd firmware/gateway && idf.py set-target esp32c6 && idf.py build
[espidf_base]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = espidf

; --- Seeed XIAO ESP32-S3 (ESP-IDF) — preferred ---
[env:seeed_xiao_esp32s3]
extends = espidf_base
board   = seeed_xiao_esp32s3

; --- Seeed XIAO ESP32-S3 + SoftAP for the Thymios (ESP-IDF) ---
;
; Same source/board as above, built with -DGATEWAY_AP so the gateway also runs
; a WiFi access point alongside ESP-NOW (single radio, shared channel — see
; src/main.cpp). Dual-core headroom keeps the ESP-NOW bridge responsive while
; clients are associated. Default SSID "SoftEdIBO" / pass "softedibo" on channel
; 1; override with -DGATEWAY_AP_SSID=... -DGATEWAY_AP_PASS=... -DGATEWAY_AP_CHANNEL=...
[env:seeed_xiao_esp32s3_ap]
extends     = espidf_base
board       = seeed_xiao_esp32s3
build_flags = -DGATEWAY_AP

; --- Seeed XIAO ESP32-C6 (ESP-IDF) ---
[env:seeed_xiao_esp32c6]
extends = espidf_base
board   = seeed_xiao_esp32c6

; --- Old: ESP32-WROOM-32 DevKit (Arduino), USB-UART bridge ---
[env:esp32dev]
platform         = espressif32 @ ^6.0.0
board            = esp32dev
framework        = arduino
upload_speed     = 921600
build_src_filter = +<*> -<main.cpp>
build_unflags    = -std=gnu++11
build_flags =
    -std=gnu++17
    -I${PROJECT_DIR}/../common
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    ; se_espnow.h pulls WiFi in from the common dir (outside src/) — declare it.
    WiFi
