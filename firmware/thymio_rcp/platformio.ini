; SoftEdIBO — Thymio RCP bring-up test.
;
; Validates the single-USB host <-> RCP UART link (XIAO ESP32-S3 host + XIAO
; ESP32-C6 radio co-processor) BEFORE investing in the 802.15.4 Thymio protocol.
; One project, one env per board (build_src_filter selects the entry point):
;   host_s3 -> src/host/  (S3: sends "PING <n>", prints the C6's "PONG <n>")
;   rcp_c6  -> src/rcp/   (C6: replies "PONG <n>" to "PING <n>")
;
; Wiring (4 wires) — see docs/THYMIO_WIRELESS_CONTROL.md:
;   S3 D6/TX(43) -> C6 D7/RX(17); S3 D7/RX(44) <- C6 D6/TX(16);
;   GND-GND (common ground); S3 5V -> C6 5V (one USB cable powers both boards).
;
; The pioarduino platform is required for XIAO C6/S3 Arduino support (the stock
; espressif32 6.x does not cover the C6) — the same fork the gateway pins for IDF.
[env]
platform      = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework     = arduino
monitor_speed = 115200

; --- Host: XIAO ESP32-S3 (has the USB cable to the PC) ---
[env:host_s3]
board            = seeed_xiao_esp32s3
build_src_filter = +<host/>

; --- RCP: XIAO ESP32-C6 (no USB to the PC; talks to the host over UART) ---
[env:rcp_c6]
board            = seeed_xiao_esp32c6
build_src_filter = +<rcp/>

; --- C6 solo: 802.15.4 radio bring-up (no S3, no soldering needed) ---
; Promiscuous sniffer — flash the C6 alone over its own USB and watch raw
; 802.15.4 frames on the USB monitor. First hands-on step of the Thymio protocol
; R&D (Phase 1): hops channels 11..26 to find where a Wireless Thymio talks.
[env:c6_radio]
board            = seeed_xiao_esp32c6
build_src_filter = +<c6_radio/>
