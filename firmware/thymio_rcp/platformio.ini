; SoftEdIBO — Thymio RCP (XIAO ESP32-C6).
;
; The C6 is the 802.15.4 radio co-processor: it drives the Thymio's wireless base
; (Aseba over 802.15.4, dongle-free) and relays to the S3 host over UART. Flashed once
; over USB, then updated over the air (WiFi-OTA from the S3's SoftAP).
;
; Wiring (4 wires) — see docs/THYMIO_WIRELESS_CONTROL.md:
;   S3 D6/TX(43) -> C6 D7/RX(17); S3 D7/RX(44) <- C6 D6/TX(16);
;   GND-GND (common ground); S3 5V -> C6 5V (one USB cable powers both boards).
;
; The pioarduino platform is required for XIAO C6 Arduino support (the stock
; espressif32 6.x does not cover the C6) — the same fork the gateway pins for IDF.
; Pin an exact release tag, never "stable": that alias's zip asset is mutated in
; place, so a CI toolchain cache built against an older "stable" download can end
; up mismatched with a newer one under the same URL (framework-arduinoespressif32
; failing to resolve, FRAMEWORK_DIR None). Bump this tag deliberately when needed.
[env]
platform      = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework     = arduino
monitor_speed = 115200

; --- RCP: XIAO ESP32-C6 (no USB to the PC; talks to the host over UART) ---
; OTA partition table (default.csv = dual app0/app1 + otadata) so this can WiFi-OTA
; itself from the S3's SoftAP — flash it once over USB, then update over the air.
[env:rcp_c6]
board                  = seeed_xiao_esp32c6
build_src_filter       = +<rcp/>
board_build.partitions = default.csv
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    WiFi
    HTTPClient
    HTTPUpdate
