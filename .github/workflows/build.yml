name: Build

on:
  push:
    branches: [master]
    tags:     ["v*"]
  pull_request:
    branches: [master]

# A newer push to the same branch/PR supersedes any run still in progress
# (tag builds are never cancelled).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # -----------------------------------------------------------------------
  # Firmware - built ONCE here (Linux) and reused by both app jobs (ESP .bin
  # files are identical regardless of the host OS, and the ESP-IDF gateway
  # build does not work on Windows runners). Each board's bins are cached
  # under a key hashed from just that board's sources, so touching one board
  # rebuilds only that board - and a push that touches no firmware builds
  # nothing at all.
  # -----------------------------------------------------------------------
  firmware:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache gateway firmware
        id: fw-gateway
        uses: actions/cache@v4
        with:
          path: firmware/gateway/firmware-s3.bin
          key: fw-gateway-${{ hashFiles('firmware/common/**', 'firmware/gateway/src/**', 'firmware/gateway/platformio.ini', 'firmware/gateway/CMakeLists.txt', 'firmware/gateway/sdkconfig*') }}

      - name: Cache actuator firmware
        id: fw-actuator
        uses: actions/cache@v4
        with:
          path: firmware/node_actuator/firmware-*.bin
          key: fw-actuator-${{ hashFiles('firmware/common/**', 'firmware/node_actuator/src/**', 'firmware/node_actuator/platformio.ini') }}

      - name: Cache magnet-sensor firmware
        id: fw-magnet
        uses: actions/cache@v4
        with:
          path: firmware/node_magnet_sensor/firmware-release.bin
          key: fw-magnet-${{ hashFiles('firmware/common/**', 'firmware/node_magnet_sensor/src/**', 'firmware/node_magnet_sensor/platformio.ini') }}

      - name: Cache Thymio RCP firmware
        id: fw-thymio
        uses: actions/cache@v4
        with:
          # Two outputs from the rcp_c6 build: the app-only image (WiFi-OTA) and the
          # merged image (firmware-c6.bin) for the wizard's first USB flash.
          path: |
            firmware/thymio_rcp/firmware.bin
            firmware/thymio_rcp/firmware-c6.bin
          key: fw-thymio-${{ hashFiles('firmware/thymio_rcp/src/**', 'firmware/thymio_rcp/platformio.ini') }}

      - name: Pick boards to build (cache misses only)
        id: fwplan
        run: |
          comps=""
          [[ "${{ steps.fw-gateway.outputs.cache-hit }}"  == "true" ]] || comps="$comps gateway"
          [[ "${{ steps.fw-actuator.outputs.cache-hit }}" == "true" ]] || comps="$comps actuator"
          [[ "${{ steps.fw-magnet.outputs.cache-hit }}"   == "true" ]] || comps="$comps magnet"
          [[ "${{ steps.fw-thymio.outputs.cache-hit }}"   == "true" ]] || comps="$comps thymio"
          comps="${comps# }"
          echo "components=$comps" >> "$GITHUB_OUTPUT"
          echo "Boards to build: ${comps:-none (all cached)}"

      - name: Set up Python
        if: steps.fwplan.outputs.components != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PlatformIO
        if: steps.fwplan.outputs.components != ''
        run: pip install platformio esptool

      # Cache only the DOWNLOAD cache (~/.platformio/.cache), never the extracted
      # install tree (~/.platformio/packages, platforms). Caching the whole tree
      # let a mismatched pioarduino framework be restored - framework-arduinoespressif32
      # present-but-invalid (or only its -libs), which resolves to None and fails
      # the C6 build with `FRAMEWORK_DIR None`. Caching just the tarballs means the
      # install is always re-extracted fresh from content-addressed downloads, so a
      # broken install can never be cached, and restore-keys is safe (a stale download
      # can't corrupt an install - worst case it is re-fetched).
      - name: Cache PlatformIO downloads
        if: steps.fwplan.outputs.components != ''
        uses: actions/cache@v4
        with:
          path: ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('firmware/**/platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-

      # Single source of truth is scripts/build-firmware.sh, so local dev
      # bundles and CI stay in sync. CI passes only the boards whose bin
      # cache missed.
      - name: Build firmware
        if: steps.fwplan.outputs.components != ''
        run: scripts/build-firmware.sh ${{ steps.fwplan.outputs.components }}

      # ----------------------------------------------------------------
      # Collect all firmware binaries (flat names, for the release zip)
      # ----------------------------------------------------------------

      - name: Collect firmware binaries
        run: |
          mkdir -p firmware-binaries
          cp firmware/gateway/firmware-s3.bin                             firmware-binaries/gateway-s3.bin
          cp firmware/node_actuator/firmware-direct-release.bin           firmware-binaries/node_direct-release.bin
          cp firmware/node_actuator/firmware-direct-debug.bin             firmware-binaries/node_direct-debug.bin
          cp firmware/node_actuator/firmware-direct-rgbw-release.bin      firmware-binaries/node_direct-rgbw-release.bin
          cp firmware/node_actuator/firmware-direct-rgbw-debug.bin        firmware-binaries/node_direct-rgbw-debug.bin
          cp firmware/node_actuator/firmware-multiplexed-release.bin      firmware-binaries/node_multiplexed-release.bin
          cp firmware/node_actuator/firmware-multiplexed-debug.bin        firmware-binaries/node_multiplexed-debug.bin
          cp firmware/node_actuator/firmware-multiplexed-rgbw-release.bin firmware-binaries/node_multiplexed-rgbw-release.bin
          cp firmware/node_actuator/firmware-multiplexed-rgbw-debug.bin   firmware-binaries/node_multiplexed-rgbw-debug.bin
          cp firmware/node_magnet_sensor/firmware-release.bin             firmware-binaries/node_magnet_sensor.bin
          cp firmware/thymio_rcp/firmware.bin                             firmware-binaries/thymio_rcp-c6-app.bin
          cp firmware/thymio_rcp/firmware-c6.bin                          firmware-binaries/thymio_rcp-c6-merged.bin

      - name: Upload firmware artifact (flat, for releases)
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware-binaries/
          retention-days: 30

      # Tree-layout copy the app jobs drop straight into the workspace so
      # PyInstaller bundles them without rebuilding any firmware.
      - name: Upload firmware binaries (tree layout, for the app bundle)
        uses: actions/upload-artifact@v4
        with:
          name: firmware-tree
          path: |
            firmware/gateway/firmware-s3.bin
            firmware/node_actuator/firmware-*.bin
            firmware/node_magnet_sensor/firmware-release.bin
            firmware/thymio_rcp/firmware.bin
            firmware/thymio_rcp/firmware-c6.bin
          retention-days: 30

  # -----------------------------------------------------------------------
  # Linux build - runs the test suite (which gates the AppImage and, via
  # `needs`, the nightly/stable releases) and produces the AppImage.
  # -----------------------------------------------------------------------
  build:
    needs: firmware
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libglib2.0-0 libdbus-1-3 \
            libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon-x11-0 libfontconfig1 \
            imagemagick libfuse2

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate Qt UI Python files
        run: |
          for ui_file in src/gui/ui/*.ui; do
            base=$(basename "$ui_file" .ui)
            pyside6-uic "$ui_file" -o "src/gui/ui_${base}.py"
          done

      - name: Inject version into src/_version.py
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="nightly"
          fi
          REPO="${GITHUB_REPOSITORY}"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '__version__ = "%s"\nGITHUB_REPO = "%s"\n__build_time__ = "%s"\n__commit__ = "%s"\n' \
            "$VERSION" "$REPO" "$BUILD_TIME" "${GITHUB_SHA}" > src/_version.py

      # Unit tests gate the build: a red suite must not produce an AppImage,
      # a Windows zip release, or a nightly (nightly/release `needs` this
      # job). Headless (offscreen QPA) - pytest/pytest-qt come from
      # requirements.txt.
      - name: Run tests
        run: QT_QPA_PLATFORM=offscreen python -m pytest -q

      # Firmware comes prebuilt from the firmware job (cache-accelerated).
      - name: Download firmware binaries
        uses: actions/download-artifact@v4
        with:
          name: firmware-tree
          path: firmware

      # ----------------------------------------------------------------
      # Python desktop application
      # ----------------------------------------------------------------

      - name: Build with PyInstaller
        run: pyinstaller softedibo.spec

      # ----------------------------------------------------------------
      # AppImage - single file, double-click to open
      # ----------------------------------------------------------------

      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract
          mv squashfs-root appimagetool-bin

      - name: Generate app icon
        run: |
          convert -size 256x256 gradient:'#1a5276-#2980b9' \
            -font DejaVu-Sans-Bold -pointsize 32 -fill white \
            -gravity Center -annotate 0 "SoftEdIBO" softedibo.png

      - name: Create AppDir
        run: |
          mkdir -p SoftEdIBO.AppDir
          cp -r dist/SoftEdIBO/. SoftEdIBO.AppDir/

          # Empty gio-modules dir prevents loading incompatible system GIO modules
          mkdir -p SoftEdIBO.AppDir/gio-modules

          cat > SoftEdIBO.AppDir/AppRun << 'APPRUN'
          #!/bin/bash
          # Prevent loading incompatible system GIO/GVfs modules
          export GIO_MODULE_DIR="$APPDIR/gio-modules"
          # Suppress atk-bridge / AT-SPI accessibility warnings
          export NO_AT_BRIDGE=1
          exec "$APPDIR/SoftEdIBO" "$@"
          APPRUN
          chmod +x SoftEdIBO.AppDir/AppRun

          cat > SoftEdIBO.AppDir/softedibo.desktop << 'DESKTOP'
          [Desktop Entry]
          Name=SoftEdIBO
          Comment=Soft-based robot for inclusive education
          Exec=SoftEdIBO
          Icon=softedibo
          Terminal=false
          Type=Application
          Categories=Education;
          DESKTOP

          cp softedibo.png SoftEdIBO.AppDir/softedibo.png
          cp softedibo.png SoftEdIBO.AppDir/.DirIcon

      - name: Build AppImage
        run: |
          ARCH=x86_64 ./appimagetool-bin/AppRun \
            SoftEdIBO.AppDir SoftEdIBO-x86_64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoftEdIBO-linux-x86_64
          path: SoftEdIBO-x86_64.AppImage
          retention-days: 30

  # -----------------------------------------------------------------------
  # Windows build - produces a portable zip. Needs only the firmware job
  # (never rebuilds firmware), so it runs in parallel with the Linux build;
  # nightly/stable releases still require the tested Linux build.
  # -----------------------------------------------------------------------
  build-windows:
    needs: firmware
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate Qt UI Python files
        shell: bash
        run: |
          for ui_file in src/gui/ui/*.ui; do
            base=$(basename "$ui_file" .ui)
            pyside6-uic "$ui_file" -o "src/gui/ui_${base}.py"
          done

      - name: Inject version into src/_version.py
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="nightly"
          fi
          REPO="${GITHUB_REPOSITORY}"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '__version__ = "%s"\nGITHUB_REPO = "%s"\n__build_time__ = "%s"\n__commit__ = "%s"\n' \
            "$VERSION" "$REPO" "$BUILD_TIME" "${GITHUB_SHA}" > src/_version.py

      # Firmware is built once on Linux (the ESP-IDF gateway build does not work
      # on Windows runners, and ESP .bin files are host-OS-independent). Drop the
      # tree-layout bins into the workspace so PyInstaller bundles them.
      - name: Download firmware binaries (built on Linux)
        uses: actions/download-artifact@v4
        with:
          name: firmware-tree
          path: firmware

      - name: Build with PyInstaller
        run: pyinstaller softedibo.spec

      - name: Create zip archive
        shell: pwsh
        run: Compress-Archive -Path dist/SoftEdIBO/* -DestinationPath SoftEdIBO-windows-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoftEdIBO-windows-x64
          path: SoftEdIBO-windows-x64.zip
          retention-days: 30

  # -----------------------------------------------------------------------
  # Every push to master: creates/updates a rolling "nightly" pre-release.
  # Not triggered on tag pushes (release job handles those).
  # -----------------------------------------------------------------------
  nightly:
    needs: [build, build-windows]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: SoftEdIBO-linux-x86_64

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: SoftEdIBO-windows-x64

      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware-binaries/

      - name: Zip firmware binaries
        run: zip -j firmware.zip firmware-binaries/*.bin

      - name: Create/update nightly pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly"
          prerelease: true
          files: |
            SoftEdIBO-x86_64.AppImage
            SoftEdIBO-windows-x64.zip
            firmware.zip
          body: |
            <!-- commit: ${{ github.sha }} -->
            Automatic build from the latest commit on `master`. Not a stable release.

            **Linux:** `chmod +x SoftEdIBO-x86_64.AppImage && ./SoftEdIBO-x86_64.AppImage`
            **Windows:** extract `SoftEdIBO-windows-x64.zip` and run `SoftEdIBO.exe`

            **Firmware** (`firmware.zip`): the S3 gateway, release/debug x RGB/RGBW builds for both actuator node types, the magnet sensor node, and the Thymio RCP (both a merged image and a WiFi-OTA app image).
            Flash merged bins at 0x0 - gateway: `esptool.py --chip esp32s3 write_flash 0x0 gateway-s3.bin`; nodes: `esptool.py --chip esp32 write_flash 0x0 <bin>`; gateway C6 first flash: `esptool.py --chip esp32c6 write_flash 0x0 thymio_rcp-c6-merged.bin`.
            `thymio_rcp-c6-app.bin` is a WiFi-OTA app image only - do **not** flash it at 0x0 (use `thymio_rcp-c6-merged.bin` for the first USB flash).

  # -----------------------------------------------------------------------
  # Tags v*: creates a stable GitHub release (available via OTA).
  # -----------------------------------------------------------------------
  release:
    needs: [build, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: SoftEdIBO-linux-x86_64

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: SoftEdIBO-windows-x64

      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware-binaries/

      - name: Zip firmware binaries
        run: zip -j firmware.zip firmware-binaries/*.bin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SoftEdIBO-x86_64.AppImage
            SoftEdIBO-windows-x64.zip
            firmware.zip
          generate_release_notes: true
          body: |
            ## Linux (x86-64)

            1. Download **`SoftEdIBO-x86_64.AppImage`**
            2. Make it executable (once):
               ```bash
               chmod +x SoftEdIBO-x86_64.AppImage
               ```
            3. **Double-click** - the setup wizard opens automatically.

            > **Serial port (USB):** if this is your first time, run:
            > `sudo usermod -aG dialout $USER`  and log out/in.

            Application data is stored in `~/.local/share/SoftEdIBO/`.

            ## Windows (x64)

            1. Download and extract **`SoftEdIBO-windows-x64.zip`**
            2. Run **`SoftEdIBO.exe`** - the setup wizard opens automatically.

            > **Serial port (USB):** install the CH340 or CP210x driver if your device isn't detected.

            Application data is stored in `%APPDATA%\SoftEdIBO\`.

            ## Firmware (`firmware.zip`)

            The desktop app already includes these binaries - use `Tools => Flash Firmware...`
            to flash. Manual flashing is also possible (all merged bins go at `0x0`;
            the gateway uses `--chip esp32s3`, the nodes `--chip esp32`):
            ```bash
            esptool.py --chip esp32 write_flash 0x0 <bin>
            ```

            | File | Node type | Description |
            |------|-----------|-------------|
            | `gateway-s3.bin` | Gateway | USB-ESP-NOW bridge + SoftAP + Thymio UART link, **Seeed XIAO ESP32-S3** (ESP-IDF) |
            | `node_direct-release.bin` | `node_direct` | 3 chambers, direct sensors/valves, onboard pumps |
            | `node_direct-debug.bin` | `node_direct` | Same as above with Serial logs (`DEBUG_BUILD`) |
            | `node_direct-rgbw-release.bin` | `node_direct` | RGBW LED-ring build (SK6812 NeoPixels) |
            | `node_direct-rgbw-debug.bin` | `node_direct` | RGBW build with Serial logs |
            | `node_multiplexed-release.bin` | `node_multiplexed` | Up to 12 chambers, multiplexed valves/sensors, optional shared pressure/vacuum tanks, runtime-sized |
            | `node_multiplexed-debug.bin` | `node_multiplexed` | Same as above with Serial logs (`DEBUG_BUILD`) |
            | `node_multiplexed-rgbw-release.bin` | `node_multiplexed` | RGBW LED-ring build (SK6812 NeoPixels) |
            | `node_multiplexed-rgbw-debug.bin` | `node_multiplexed` | RGBW build with Serial logs |
            | `node_magnet_sensor.bin` | `node_magnet_sensor` | 4x MLX90393 magnetic touch board (node_magnet_sensor protocol) |
            | `thymio_rcp-c6-merged.bin` | Thymio RCP | XIAO ESP32-C6 802.15.4 co-processor - **merged image for the first USB flash** (`Tools => Flash Firmware...` gateway step, or `esptool.py --chip esp32c6 write_flash 0x0 thymio_rcp-c6-merged.bin`) |
            | `thymio_rcp-c6-app.bin` | Thymio RCP | Same firmware, **WiFi-OTA app image, never flash at 0x0** - used for over-the-air updates after the first flash |
