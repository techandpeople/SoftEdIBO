# Example configuration for touch position tracking on soft robot skins.
# Same shape as config/settings.yaml; see docs/TOUCH_POSITION_TRACKING.md for
# the full parameter reference. Most of this is written by the GUI (Robot
# Config / Skin dialog / Tools -> Calibrate Touch Coupling...); the touch
# tuning keys are hand-authored or copied from the live Touch tuning panel.

gateway:
  serial_port: /dev/ttyACM0
  baud_rate: 115200

robots:
  # Turtle and Tree are separate robot kinds built on the SAME node_multiplexed
  # board (moved between bodies), so the same MAC may appear under both.
  turtles:
    - id: turtle_1
      nodes:
        # Pneumatic control board
        - mac: "AA:BB:CC:DD:EE:01"
          node_type: "node_multiplexed"
          max_slots: 12
        # Magnetic touch board (4x MLX90393)
        - mac: "BB:CC:DD:EE:FF:00"
          node_type: "node_magnet_sensor"

      skins:
        - skin_id: belly
          # skin_type picks the hardcoded geometry (shape + sensor coordinates,
          # src/hardware/skin_geometry.py); skin_variant is the silicone cast.
          skin_type: turtle_square
          skin_variant: natural
          chambers:
            - {mac: "AA:BB:CC:DD:EE:01", slot: 0, max_pressure: 8.0}
            - {mac: "AA:BB:CC:DD:EE:01", slot: 1, max_pressure: 8.0}
            - {mac: "AA:BB:CC:DD:EE:01", slot: 2, max_pressure: 8.0}

          touch:
            node_mac: "BB:CC:DD:EE:FF:00"   # the node_magnet_sensor above
            sensor_count: 4                  # quadrant tracking needs exactly 4

            # Routing: sensor index -> skin-local chamber (default 1:1).
            sensor_to_chamber: {"0": 0, "1": 0, "2": 1, "3": 2}

            # Detection tuning (all optional; raw uT units).
            quadrant_thresholds: [100, 100, 100, 100]  # per-sensor activation, uT
            hysteresis: 20                   # uT below threshold before deactivation
            ema_alpha: 0.25                  # EMA for the displayed sensor values
            position_smoothing: 0.3          # confidence EMA factor, higher = faster
            min_touch_duration_ms: 100       # ignore touches shorter than this

            # Written by Tools -> Calibrate Touch Coupling... (docs/TOUCH_COUPLING.md):
            # coupling: {...}
            # compensation: {enabled: true, threshold_ut: 300, ...}

  trees:
    - id: tree_1
      nodes:
        - mac: "AA:BB:CC:DD:EE:01"           # same board as turtle_1 (swapped body)
          node_type: "node_multiplexed"
          max_slots: 12
        - mac: "DD:EE:FF:00:01:02"
          node_type: "node_magnet_sensor"

      skins:
        - skin_id: trunk
          skin_type: tree_round
          skin_variant: wrinkles
          chambers:
            - {mac: "AA:BB:CC:DD:EE:01", slot: 0, max_pressure: 8.0}
            - {mac: "AA:BB:CC:DD:EE:01", slot: 1, max_pressure: 8.0}

          touch:
            node_mac: "DD:EE:FF:00:01:02"
            sensor_count: 4
            sensor_to_chamber: {"0": 0, "1": 0, "2": 1, "3": 1}
            # Per-sensor thresholds when sensors differ in sensitivity (uT).
            quadrant_thresholds: [80, 120, 100, 90]
            hysteresis: 30                   # raise if detection flickers
            position_smoothing: 0.4
            min_touch_duration_ms: 50        # shorter minimum for quick taps

  thymios: []

# Activities are behaviour-engine scripts authored in Tools -> Activity Editor...
# (stored in the database, not in this file). They consume touch through the
# wait_for_touch / touch_count / touch_progress / gesture_count blocks, or read
# skin.get_touch_position() for the zone name. See docs/ACTIVITIES.md and
# docs/TOUCH_POSITION_TRACKING.md.
